<!DOCTYPE html>
<html lang="id">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#020617;

    --panel2:#0b1728;
    --line:#12304b;

    --blue:#1688ff;

    --green:#00ff9d;
    --red:#ff426d;

    --muted:#7f9bb2;
}

body{

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,234,255,.10),
            transparent 30%

}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;

    background-image:
        linear-gradient(
            rgba(0,234,255,.35) 1px,

            rgba(0,234,255,.35) 1px,

}

.app{

}


/* =========================
   SIDEBAR
========================= */

}

.logo span{

}

.new-chat{

    border:1px solid var(--cyan);

    background:rgba(0,234,255,.06);

    transition:.25s;
}

.new-chat:hover{
    background:rgba(0,234,255,.16);

        0 0 18px rgba(0,234,255,.25);
}

.side-title{
    color:var(--muted);

    font-size:11px;

}

.history{

}

.history-item{

    border-radius:8px;

    margin-bottom:7px;

    border:1px solid transparent;

    cursor:pointer;

    color:#b9d0df;

    font-size:13px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.history-item:hover{

    background:rgba(0,234,255,.05);
}

.side-bottom{
    border-top:1px solid var(--line);

    padding-top:14px;
}

.clear-btn{
    width:100%;

    padding:10px;

    border-radius:8px;

    border:1px solid rgba(255,66,109,.35);

    background:rgba(255,66,109,.05);

    color:#ff7190;

    cursor:pointer;
}

.status{
    margin-top:10px;

    text-align:center;

    font-size:11px;

    color:var(--green);
}


/* =========================
   MAIN
========================= */

.main{
    flex:1;

    display:flex;

    flex-direction:column;

    min-width:0;
}

.topbar{
    height:68px;

    border-bottom:1px solid var(--line);

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 22px;

    background:rgba(3,10,22,.65);

    backdrop-filter:blur(12px);
}

.top-title{
    display:flex;

    align-items:center;

    gap:10px;
}

.online{
    width:10px;
    height:10px;

    background:var(--green);

    box-shadow:

}

@keyframes pulse{

    }

.top-title strong{

.version{

}

@keyframes orb{

.welcome p{

}

.quick{

.quick button{

}

.quick button:hover{

/* =========================

.message{

.message.user{

.avatar{

    align-items:center;

    justify-content:center;

    border:1px solid var(--line);

    background:var(--panel2);
}

.user .avatar{

}

.bubble{
    max-width:min(780px,80%);

    padding:13px 15px;

    border-radius:13px;

    line-height:1.65;

    font-size:14px;

    white-space:pre-wrap;

    word-break:break-word;
}

.user .bubble{

            #0b3150,
            #09243b

    border-bottom-right-radius:3px;

.ai .bubble{

}

.ai-actions{

.voice-btn{

    background:rgba(0,234,255,.04);

    padding:6px 9px;

    border-radius:7px;

}

.voice-btn:hover{
    border-color:var(--cyan);

}

.voice-btn.speaking{
    color:var(--green);

    border-color:var(--green);
}


/* =========================
   TYPING
========================= */

.typing{
    display:flex;

    gap:5px;

    padding:6px 2px;
}

.typing span{
    width:7px;
    height:7px;

    background:var(--cyan);

    border-radius:50%;

    animation:typing .8s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{

    0%,100%{
        opacity:.2;
        transform:translateY(0);
    }

    50%{
        opacity:1;
        transform:translateY(-4px);
    }

}


/* =========================
   INPUT
========================= */

.input-area{
    padding:15px max(15px,4vw) 20px;

    border-top:1px solid var(--line);

    background:rgba(2,8,18,.88);

    backdrop-filter:blur(15px);
}

.input-box{
    max-width:950px;

    gap:8px;

    border-radius:14px;

    transition:.25s;
}

.input-box:focus-within{
    border-color:var(--cyan);

    box-shadow:
        0 0 20px rgba(0,234,255,.09);

textarea{

    resize:none;

    min-height:42px;

    max-height:140px;

    border:0;

    outline:0;

    background:transparent;

    color:white;

    padding:11px 8px;

    font-size:14px;

    font-family:inherit;

textarea::placeholder{

}

.action-btn{
    width:43px;
    height:43px;

    min-width:43px;

    border-radius:10px;

    border:1px solid var(--line);

    background:#091b2d;

    color:#a8c7d9;

    cursor:pointer;

    font-size:18px;

    transition:.2s;
}

.action-btn:hover{
    border-color:var(--cyan);

    color:var(--cyan);
}

.send-btn{
    background:
        linear-gradient(
            135deg,
            #006f91,
            #004a72
        );

    color:white;

    border-color:#00a9d0;
}

.send-btn:hover{
    box-shadow:
        0 0 18px rgba(0,234,255,.25);
}

.mic-btn{
    position:relative;
}

.mic-btn.recording{
    background:rgba(255,66,109,.16);

    border-color:var(--red);

    color:#ff5d83;

    animation:micPulse 1s infinite;
}

@keyframes micPulse{

    0%,100%{
        box-shadow:
            0 0 0 rgba(255,66,109,0);
    }

    50%{
        box-shadow:
            0 0 22px rgba(255,66,109,.45);
    }

}

.voice-status{
    max-width:950px;

    margin:7px auto 0;

    height:17px;

    text-align:center;

    font-size:11px;

    color:var(--muted);

.voice-status.active{
    color:#ff7190;

/* =========================
   MOBILE
========================= */

.mobile-menu{
    display:none;

    border:1px solid var(--line);

    background:transparent;

    color:var(--cyan);

    width:38px;

    height:38px;

    border-radius:8px;

}

@media(max-width:800px){

    .sidebar{
        position:fixed;

        left:-290px;

        top:0;

        bottom:0;

        z-index:20;

        transition:.3s;

    .sidebar.open{

    .mobile-menu{

    .topbar{

    }

    .top-title{
        gap:7px;
    }

    .version{
        display:none;
    }

    .chat{
        padding:18px 10px;
    }

    .welcome{
        margin:15px auto;

    }

    .ai-orb{

    .bubble{

    }

    .input-area{
        padding:10px 8px 13px;
    }

    .input-box{
        gap:5px;
    }

    .action-btn{
        width:40px;

        min-width:40px;

        height:40px;
    }

}


/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-track{
    background:#020617;
}

::-webkit-scrollbar-thumb{
    background:#12304b;

    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:#185778;
}

</style>

</head>

<body>

<script>

/* ==================================================
   ALFA AI V3.1 FIX
   CLOUDflare Worker
================================================== */

const API_URL =
"https://shrill-haze-a236.adnan0076767.workers.dev/chat";


/* ==================================================
   STATE
================================================== */

let messages = [];

let recognition = null;

let isRecording = false;

let currentUtterance = null;


/* ==================================================
   MEMORY
================================================== */

function loadMemory(){

    try{

        const saved =
            localStorage.getItem(
                "alfa_ai_messages"
            );

        if(saved){

            messages =
                JSON.parse(saved);

        }

    }catch(error){

        console.error(
            "Memory error:",
            error
        );

        messages = [];

    }

}


function saveMemory(){

    try{

        localStorage.setItem(
            "alfa_ai_messages",
            JSON.stringify(messages)
        );

    }catch(error){

        console.error(
            "Save memory error:",
            error
        );

    }

}


/* ==================================================
   WELCOME SCREEN
================================================== */

function getWelcomeHTML(){

    return `

    <div
        class="welcome"
        id="welcome"
    >

        <div class="ai-orb">
            🤖
        </div>


        <h2>
            ALFA AI
        </h2>


        <p>

            Halo Bosss 👋<br>

            Saya ALFA AI V3.1
            dengan Voice Chat.

            Tekan 🎙️ untuk berbicara
            atau ketik pesan biasa.

        </p>


        <div class="quick">


            <button
                onclick="quickAsk(
                'Jelaskan apa itu OSINT dengan sederhana'
                )"
            >
                🔎 Belajar OSINT
            </button>


            <button
                onclick="quickAsk(
                'Bantu saya membuat website profesional'
                )"
            >
                🌐 Website
            </button>


            <button
                onclick="quickAsk(
                'Beri saya ide bisnis digital sederhana'
                )"
            >
                💡 Ide Bisnis
            </button>


            <button
                onclick="quickAsk(
                'Apa yang bisa kamu lakukan?'
                )"
            >
                🤖 Kemampuan AI
            </button>


        </div>

    </div>

    `;

}


/* ==================================================
   RENDER CHAT
================================================== */

function renderMessages(){

    const chat =
        document.getElementById(
            "chat"
        );


    chat.innerHTML = "";


    if(messages.length === 0){

        chat.innerHTML =
            getWelcomeHTML();

        updateHistory();

        return;

    }


    messages.forEach(
        function(message,index){

            addMessageToDOM(
                message.role,
                message.content,
                false,
                index
            );

        }
    );


    updateHistory();

    scrollBottom();

}


/* ==================================================
   ADD MESSAGE
================================================== */

function addMessageToDOM(
    role,
    content,
    animate=false,
    index=-1
){

    const chat =
        document.getElementById(
            "chat"
        );


    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "message " +
        (
            role === "user"
            ? "user"
            : "ai"
        );


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar";


    avatar.textContent =
        role === "user"
        ? "👤"
        : "🤖";


    const contentWrap =
        document.createElement(
            "div"
        );


    contentWrap.style.maxWidth =
        "100%";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    contentWrap.appendChild(
        bubble
    );


    if(role !== "user"){

        const actions =
            document.createElement(
                "div"
            );


        actions.className =
            "ai-actions";


        const speakButton =
            document.createElement(
                "button"
            );


        speakButton.className =
            "voice-btn";


        speakButton.innerHTML =
            "🔊 Dengarkan";


        speakButton.onclick =
            function(){

                speakText(
                    content,
                    speakButton
                );

            };


        actions.appendChild(
            speakButton
        );


        contentWrap.appendChild(
            actions
        );

    }


    wrapper.appendChild(
        avatar
    );


    wrapper.appendChild(
        contentWrap
    );


    chat.appendChild(
        wrapper
    );


    if(animate){

        typeText(
            bubble,
            content
        );

    }else{

        bubble.textContent =
            content;

    }

}


/* ==================================================
   TYPE EFFECT
================================================== */

function typeText(
    element,
    text
){

    let index = 0;


    element.textContent = "";


    const timer =
        setInterval(
            function(){

                element.textContent +=
                    text.charAt(index);


                index++;


                scrollBottom();


                if(index >= text.length){

                    clearInterval(
                        timer
                    );

                }

            },
            7
        );

}


/* ==================================================
   IMPORTANT RESPONSE PARSER
================================================== */

function extractAIAnswer(data){

    console.log(
        "ALFA AI RAW RESPONSE:",
        data
    );


    /*
       FORMAT 1
       {
          response:"..."
       }
    */

    if(
        typeof data === "object" &&
        typeof data.response === "string" &&
        data.response.trim()
    ){

        return data.response.trim();

    }


    /*
       FORMAT 2
       {
          message:"..."
       }
    */

    if(
        typeof data === "object" &&
        typeof data.message === "string" &&
        data.message.trim()
    ){

        return data.message.trim();

    }


    /*
       FORMAT 3
       {
          result:"..."
       }
    */

    if(
        typeof data === "object" &&
        typeof data.result === "string" &&
        data.result.trim()
    ){

        return data.result.trim();

    }


    /*
       FORMAT 4
       {
          text:"..."
       }
    */

    if(
        typeof data === "object" &&
        typeof data.text === "string" &&
        data.text.trim()
    ){

        return data.text.trim();

    }


    /*
       FORMAT 5
       {
          answer:"..."
       }
    */

    if(
        typeof data === "object" &&
        typeof data.answer === "string" &&
        data.answer.trim()
    ){

        return data.answer.trim();

    }


    /*
       FORMAT 6
       Cloudflare AI style:
       {
          result:{
             response:"..."
          }
       }
    */

    if(
        data &&
        data.result &&
        typeof data.result === "object"
    ){

        if(
            typeof data.result.response === "string" &&
            data.result.response.trim()
        ){

            return data.result.response.trim();

        }


        if(
            typeof data.result.text === "string" &&
            data.result.text.trim()
        ){

            return data.result.text.trim();

        }


        if(
            typeof data.result.message === "string" &&
            data.result.message.trim()
        ){

            return data.result.message.trim();

        }

    }


    /*
       FORMAT 7
       OpenAI-like:
       choices[0].message.content
    */

    if(
        data &&
        Array.isArray(data.choices) &&
        data.choices.length
    ){

        const choice =
            data.choices[0];


        if(
            choice &&
            choice.message &&
            typeof choice.message.content === "string"
        ){

            return choice.message.content.trim();

        }


        if(
            choice &&
            typeof choice.text === "string"
        ){

            return choice.text.trim();

        }

    }


    /*
       FORMAT 8
       data.output_text
    */

    if(
        data &&
        typeof data.output_text === "string" &&
        data.output_text.trim()
    ){

        return data.output_text.trim();

    }


    /*
       FORMAT 9
       data.content
    */

    if(
        data &&
        typeof data.content === "string" &&
        data.content.trim()
    ){

        return data.content.trim();

    }


    /*
       FORMAT 10
       Jika Worker ternyata mengirim
       plain text sebagai string
    */

    if(
        typeof data === "string" &&
        data.trim()
    ){

        return data.trim();

    }


    return null;

}


/* ==================================================
   SEND MESSAGE
================================================== */

async function sendMessage(){

    const input =
        document.getElementById(
            "input"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    input.value = "";

    autoResize(input);


    if(isRecording){

        stopVoice();

    }


    messages.push({

        role:"user",

        content:text

    });


    saveMemory();


    renderMessages();


    showTyping();


    try{

        const response =
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:text

                    })

                }
            );


        console.log(
            "HTTP STATUS:",
            response.status
        );


        if(!response.ok){

            const errorText =
                await response.text();


            console.error(
                "WORKER ERROR:",
                errorText
            );


            throw new Error(
                "HTTP " +
                response.status +
                " - " +
                errorText
            );

        }


        /*
           Ambil response sebagai text
           terlebih dahulu.

           Ini membuat frontend
           tidak langsung gagal jika
           Worker mengirim plain text.
        */

        const raw =
            await response.text();


        console.log(
            "WORKER RAW:",
            raw
        );


        let data;


        try{

            data =
                JSON.parse(raw);

        }catch(parseError){

            /*
               Kalau bukan JSON,
               langsung anggap sebagai
               jawaban AI plain text.
            */

            data = raw;

        }


        removeTyping();


        const answer =
            extractAIAnswer(data);


        if(!answer){

            console.error(
                "FORMAT RESPONSE TIDAK DIKENALI:",
                data
            );


            const fallback =
                "⚠️ ALFA AI menerima response dari Worker, tetapi format jawabannya belum dikenali.\n\nRaw response:\n" +
                raw.substring(0,1000);


            messages.push({

                role:"assistant",

                content:fallback

            });


            saveMemory();


            addMessageToDOM(
                "assistant",
                fallback,
                true
            );


            updateHistory();

            scrollBottom();

            return;

        }


        /*
           JAWABAN AI BERHASIL
        */

        messages.push({

            role:"assistant",

            content:answer

        });


        saveMemory();


        addMessageToDOM(
            "assistant",
            answer,
            true,
            messages.length - 1
        );


        updateHistory();


        scrollBottom();


    }catch(error){

        console.error(
            "ALFA AI ERROR:",
            error
        );


        removeTyping();


        const errorMessage =
            "⚠️ Koneksi ke ALFA AI gagal.\n\n" +
            "Detail: " +
            error.message;


        messages.push({

            role:"assistant",

            content:errorMessage

        });


        saveMemory();


        addMessageToDOM(
            "assistant",
            errorMessage,
            true
        );


        updateHistory();


        scrollBottom();

    }

}

/* ==================================================
   VOICE RECOGNITION
================================================== */

function initRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        recognition = null;

        document.getElementById(
            "voiceStatus"
        ).textContent =
            "Voice input tidak didukung browser ini.";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "id-ID";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            isRecording = true;


            const mic =
                document.getElementById(
                    "micBtn"
                );


            const status =
                document.getElementById(
                    "voiceStatus"
                );


            mic.classList.add(
                "recording"
            );


            mic.innerHTML =
                "⏹️";


            status.textContent =
                "🔴 Mendengarkan... silakan bicara";


            status.classList.add(
                "active"
            );

        };


    recognition.onresult =
        function(event){

            let transcript = "";


            for(
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ){

                transcript +=
                    event.results[i][0]
                        .transcript;

            }


            const input =
                document.getElementById(
                    "input"
                );


            input.value =
                transcript;


            autoResize(input);

        };


    recognition.onerror =
        function(event){

            console.error(
                "VOICE ERROR:",
                event.error
            );


            const status =
                document.getElementById(
                    "voiceStatus"
                );


            if(
                event.error ===
                "not-allowed"
            ){

                status.textContent =
                    "⚠️ Microphone ditolak. Izinkan microphone di browser.";

            }else if(
                event.error ===
                "no-speech"
            ){

                status.textContent =
                    "Tidak ada suara terdeteksi.";

            }else{

                status.textContent =
                    "Voice error: " +
                    event.error;

            }

        };


    recognition.onend =
        function(){

            isRecording = false;


            const mic =
                document.getElementById(
                    "micBtn"
                );


            const status =
                document.getElementById(
                    "voiceStatus"
                );


            mic.classList.remove(
                "recording"
            );


            mic.innerHTML =
                "🎙️";


            status.classList.remove(
                "active"
            );


            const input =
                document.getElementById(
                    "input"
                );


            if(input.value.trim()){

                status.textContent =
                    "Suara berhasil menjadi teks. Tekan ➤ untuk mengirim.";

            }else{

                status.textContent =
                    "Voice siap digunakan";

            }

        };

}


/* ==================================================
   VOICE BUTTON
================================================== */

function toggleVoice(){

    if(!recognition){

        alert(
            "Browser ini belum mendukung Voice Input. Coba Google Chrome atau Microsoft Edge."
        );

        return;

    }


    if(isRecording){

        stopVoice();

    }else{

        startVoice();

    }

}


function startVoice(){

    try{

        recognition.start();

    }catch(error){

        console.log(
            "Recognition start:",
            error
        );

    }

}


function stopVoice(){

    if(
        recognition &&
        isRecording
    ){

        recognition.stop();

    }

}


/* ==================================================
   TEXT TO SPEECH
================================================== */

function speakText(
    text,
    button
){

    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "Browser ini belum mendukung Text-to-Speech."
        );

        return;

    }


    if(
        speechSynthesis.speaking
    ){

        speechSynthesis.cancel();


        document
            .querySelectorAll(
                ".voice-btn"
            )
            .forEach(
                function(btn){

                    btn.classList.remove(
                        "speaking"
                    );

                    btn.innerHTML =
                        "🔊 Dengarkan";

                }
            );


        return;

    }


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "id-ID";


    utterance.rate =
        1;


    utterance.pitch =
        1;


    currentUtterance =
        utterance;


    button.classList.add(
        "speaking"
    );


    button.innerHTML =
        "⏹️ Stop";


    utterance.onend =
        function(){

            button.classList.remove(
                "speaking"
            );


            button.innerHTML =
                "🔊 Dengarkan";


            currentUtterance =
                null;

        };


    utterance.onerror =
        function(){

            button.classList.remove(
                "speaking"
            );


            button.innerHTML =
                "🔊 Dengarkan";


            currentUtterance =
                null;

        };


    speechSynthesis.speak(
        utterance
    );

}


/* ==================================================
   QUICK COMMAND
================================================== */

function quickAsk(text){

    const input =
        document.getElementById(

        );

/* ==================================================
   NEW CHAT
================================================== */

function newChat(){

    messages = [];


    saveMemory();


    if(
        "speechSynthesis" in window
    ){

        speechSynthesis.cancel();

    }


    renderMessages();


    document
        .getElementById(
            "input"
        )
        .focus();


    closeSidebar();

}


/* ==================================================
   CLEAR MEMORY
================================================== */

function clearHistory(){

    const confirmed =
        confirm(
            "Hapus semua memory percakapan ALFA AI?"
        );


    if(!confirmed){

        return;

    }


    messages = [];


    localStorage.removeItem(
        "alfa_ai_messages"
    );


    if(
        "speechSynthesis" in window
    ){

        speechSynthesis.cancel();

    }


    renderMessages();

}


/* ==================================================
   HISTORY
================================================== */

function updateHistory(){

    const history =
        document.getElementById(
            "history"
        );


    history.innerHTML = "";


    const userMessages =
        messages.filter(
            function(message){

                return message.role === "user";

            }
        );


    if(!userMessages.length){

        history.innerHTML = `

            <div
                style="
                color:#506c7e;
                font-size:12px;
                padding:10px 4px;
                "
            >
                Belum ada percakapan
            </div>

        `;

        return;

    }


    userMessages
        .slice()
        .reverse()
        .forEach(
            function(message){

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                item.textContent =
                    message.content;


                item.onclick =
                    function(){

                        const index =
                            messages.indexOf(
                                message
                            );


                        const messageElements =
                            document.querySelectorAll(
                                ".message"
                            );


                        if(
                            messageElements[index]
                        ){

                            messageElements[index]
                                .scrollIntoView({
                                    behavior:"smooth"
                                });

                        }


                        closeSidebar();

                    };


                history.appendChild(
                    item
                );

            }
        );

}


/* ==================================================
   TEXTAREA
================================================== */

function autoResize(element){

    element.style.height =
        "auto";


    element.style.height =
        Math.min(
            element.scrollHeight,
            140
        ) + "px";

}


function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* ==================================================
   SCROLL
================================================== */

function scrollBottom(){

    const chat =
        document.getElementById(
            "chat"
        );


    setTimeout(
        function(){

            chat.scrollTop =
                chat.scrollHeight;

        },
        30
    );

}


/* ==================================================
   MOBILE SIDEBAR
================================================== */

function toggleSidebar(){

    document
        .getElementById(
            "sidebar"
        )
        .classList.toggle(
            "open"
        );

}


function closeSidebar(){

    document
        .getElementById(
            "sidebar"
        )
        .classList.remove(
            "open"
        );

}

   START
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initRecognition();

        loadMemory();

        renderMessages();

        document
            .getElementById(
                "input"
            )
            .focus();

    }
);
