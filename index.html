<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALFA AI V2.1 | AI Command Center</title>

<meta name="description"
content="ALFA AI - AI Command Center berbasis Cloudflare Workers AI.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:#020617;
    color:#e2e8f0;
    overflow-x:hidden;
}

/* BACKGROUND */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(14,165,233,.10);
    filter:blur(100px);
    top:-200px;
    left:-150px;
    pointer-events:none;
}

/* APP */
.app{
    width:min(1100px,94%);
    margin:auto;
    padding:25px 0;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo-icon{
    width:50px;
    height:50px;
    display:grid;
    place-items:center;
    border:1px solid rgba(34,211,238,.5);
    border-radius:16px;
    background:rgba(8,47,73,.65);
    box-shadow:
        0 0 20px rgba(34,211,238,.18),
        inset 0 0 20px rgba(34,211,238,.08);
    font-size:25px;
}

.logo h1{
    font-size:21px;
    letter-spacing:2px;
}

.logo p{
    margin-top:4px;
    color:#64748b;
    font-size:12px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 13px;
    border:1px solid rgba(34,211,238,.2);
    border-radius:999px;
    background:rgba(15,23,42,.75);
    font-size:12px;
    color:#94a3b8;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
}

/* MAIN */
.panel{
    border:1px solid rgba(51,65,85,.8);
    border-radius:25px;
    background:rgba(2,6,23,.82);
    backdrop-filter:blur(18px);
    overflow:hidden;
    box-shadow:
        0 25px 80px rgba(0,0,0,.45),
        0 0 50px rgba(14,165,233,.06);
}

/* TOP BAR */
.panel-top{
    padding:16px 20px;
    border-bottom:1px solid rgba(51,65,85,.7);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.panel-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    color:#94a3b8;
}

.live{
    color:#22d3ee;
}

/* CHAT */
.chat{
    height:550px;
    overflow-y:auto;
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.chat::-webkit-scrollbar{
    width:6px;
}

.chat::-webkit-scrollbar-thumb{
    background:#1e3a5f;
    border-radius:10px;
}

/* MESSAGE */
.message{
    max-width:82%;
    padding:15px 17px;
    border-radius:18px;
    line-height:1.6;
    font-size:14px;
    white-space:pre-wrap;
    animation:messageIn .25s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.ai{
    align-self:flex-start;
    background:rgba(15,23,42,.9);
    border:1px solid rgba(34,211,238,.13);
    box-shadow:0 0 25px rgba(14,165,233,.04);
}

.user{
    align-self:flex-end;
    background:linear-gradient(135deg,#075985,#0e7490);
    border:1px solid rgba(103,232,249,.25);
}

.message-label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:7px;
    color:#64748b;
}

.user .message-label{
    color:#bae6fd;
}

/* TYPING */
.typing{
    display:none;
    align-self:flex-start;
    padding:15px 18px;
    border-radius:18px;
    background:#0f172a;
    border:1px solid #1e293b;
}

.typing span{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#22d3ee;
    margin:0 3px;
    animation:typing 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        opacity:.25;
        transform:translateY(0);
    }
    30%{
        opacity:1;
        transform:translateY(-4px);
    }
}

/* QUICK */
.quick{
    padding:0 25px 18px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.quick button{
    border:1px solid #1e3a5f;
    background:#07111f;
    color:#94a3b8;
    border-radius:999px;
    padding:8px 12px;
    cursor:pointer;
    font-size:11px;
    transition:.2s;
}

.quick button:hover{
    color:#67e8f9;
    border-color:#0891b2;
    transform:translateY(-2px);
}

/* INPUT */
.input-area{
    padding:18px;
    border-top:1px solid rgba(51,65,85,.7);
    background:rgba(3,7,18,.9);
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:10px;
}

textarea{
    width:100%;
    min-height:55px;
    max-height:150px;
    resize:none;
    padding:16px;
    border-radius:16px;
    border:1px solid #1e293b;
    outline:none;
    background:#020617;
    color:#e2e8f0;
    font-family:inherit;
    font-size:14px;
}

textarea:focus{
    border-color:#0891b2;
    box-shadow:0 0 20px rgba(8,145,178,.12);
}

.send{
    width:55px;
    height:55px;
    flex:none;
    border:0;
    border-radius:16px;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#0891b2,#2563eb);
    font-size:20px;
    box-shadow:0 0 20px rgba(37,99,235,.25);
    transition:.2s;
}

.send:hover{
    transform:translateY(-2px);
    box-shadow:0 0 30px rgba(34,211,238,.35);
}

.send:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

/* FOOTER */
.footer{
    text-align:center;
    color:#475569;
    font-size:11px;
    padding:18px;
}

/* MOBILE */
@media(max-width:650px){

    .app{
        width:96%;
        padding:12px 0;
    }

    .header{
        align-items:flex-start;
    }

    .status{
        font-size:10px;
    }

    .logo h1{
        font-size:17px;
    }

    .chat{
        height:58vh;
        padding:17px;
    }

    .message{
        max-width:92%;
        font-size:13px;
    }

    .quick{
        padding:0 17px 15px;
    }

    .input-area{
        padding:12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                🤖
            </div>

            <div>
                <h1>ALFA AI</h1>
                <p>AI COMMAND CENTER V2.1</p>
            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            AI BACKEND ONLINE
        </div>

    </header>


    <main class="panel">

        <div class="panel-top">

            <div class="panel-title">
                <span class="live">●</span>
                CLOUD AI CONNECTION
            </div>

            <div class="panel-title">
                Llama AI
            </div>

        </div>


        <div id="chat" class="chat">

            <div class="message ai">

                <div class="message-label">
                    ALFA AI
                </div>

                Halo bosss! 👋

                Saya <b>ALFA AI</b>, sekarang sudah terhubung ke backend Cloudflare Workers AI.

                Silakan kirim pertanyaan atau perintah apa saja.

            </div>

        </div>


        <div id="typing" class="typing">

            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="quick">

            <button onclick="quickAsk('Halo ALFA AI')">
                👋 Halo
            </button>

            <button onclick="quickAsk('Jelaskan apa yang bisa kamu lakukan')">
                🤖 Kemampuan
            </button>

            <button onclick="quickAsk('Bantu saya membuat website')">
                🌐 Website
            </button>

            <button onclick="quickAsk('Buatkan ide bisnis online')">
                💡 Ide bisnis
            </button>

        </div>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    placeholder="Ketik pesan untuk ALFA AI..."
                    autocomplete="off"
                ></textarea>

                <button
                    class="send"
                    id="send"
                    onclick="sendMessage()"
                    title="Kirim"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>


    <div class="footer">
        ALFA AI V2.1 • Cloudflare Workers AI • AI Command Center
    </div>

</div>


<script>

/* =====================================================
   ALFA AI V2.1
   CLOUDFLARE WORKER BACKEND
===================================================== */

const API_URL =
"https://shrill-haze-a236.adnan0076767.workers.dev/chat";


const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const typing = document.getElementById("typing");


/* =====================================================
   TAMBAH PESAN
===================================================== */

function addMessage(type, text){

    const message = document.createElement("div");

    message.className =
        "message " + type;

    const label = document.createElement("div");

    label.className =
        "message-label";

    label.textContent =
        type === "user"
        ? "YOU"
        : "ALFA AI";

    const content =
        document.createElement("div");

    content.textContent = text;

    message.appendChild(label);
    message.appendChild(content);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =====================================================
   TYPING
===================================================== */

function showTyping(){

    typing.style.display =
        "block";

    chat.appendChild(
        typing
    );

    chat.scrollTop =
        chat.scrollHeight;
}


function hideTyping(){

    typing.style.display =
        "none";
}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const message =
        input.value.trim();

    if(!message){
        return;
    }

    addMessage(
        "user",
        message
    );

    input.value = "";

    send.disabled = true;

    showTyping();

    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({
                        message:message
                    })
                }
            );


        const data =
            await response.json();


        hideTyping();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Server AI mengalami masalah."
            );

        }


        if(!data.success){

            throw new Error(
                data.error ||
                "AI tidak memberikan jawaban."
            );

        }


        addMessage(
            "ai",
            data.reply ||
            "AI tidak memberikan respons."
        );


    }catch(error){

        hideTyping();

        addMessage(
            "ai",
            "⚠️ Terjadi masalah saat menghubungkan ke ALFA AI.\n\n" +
            error.message
        );

    }


    send.disabled =
        false;

    input.focus();
}


/* =====================================================
   QUICK COMMAND
===================================================== */

function quickAsk(text){

    input.value =
        text;

    sendMessage();

}


/* =====================================================
   ENTER TO SEND
===================================================== */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   AUTO RESIZE TEXTAREA
===================================================== */

input.addEventListener(
    "input",
    function(){

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                150
            ) + "px";

    }
);

</script>

</body>
</html>
