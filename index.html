<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030712">
<meta name="color-scheme" content="dark">

<title>ALFA AI V5.7 | NATURAL VOICE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%,rgba(0,229,255,.11),transparent 30%),
    radial-gradient(circle at 85% 90%,rgba(139,92,246,.13),transparent 35%),
    #030712;
  color:#e5f7ff;
  font-family:Inter,Segoe UI,Arial,sans-serif;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(0,229,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.025) 1px,transparent 1px);
  background-size:40px 40px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1100px,94%);
  margin:auto;
  padding:18px 0 35px;
}

/* HEADER */

.header{
  position:sticky;
  top:8px;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 17px;
  margin-bottom:15px;
  border:1px solid rgba(0,229,255,.18);
  border-radius:20px;
  background:rgba(3,7,18,.84);
  backdrop-filter:blur(18px);
  box-shadow:0 0 35px rgba(0,229,255,.07);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:900;
  color:#001018;
  background:linear-gradient(135deg,#00e5ff,#8b5cf6);
  box-shadow:0 0 22px rgba(0,229,255,.3);
}

.brand h1{
  font-size:17px;
  letter-spacing:.8px;
}

.brand small{
  display:block;
  margin-top:2px;
  color:#67e8f9;
  font-size:10px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#86efac;
  font-size:10px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 12px #22c55e;
}

/* HERO */

.hero{
  text-align:center;
  padding:15px 7px 16px;
}

.hero h2{
  font-size:clamp(28px,5vw,46px);
  line-height:1.05;
  background:linear-gradient(90deg,#fff,#67e8f9,#a78bfa);
  -webkit-background-clip:text;
  color:transparent;
  margin-bottom:10px;
}

.hero p{
  max-width:720px;
  margin:auto;
  color:#94a3b8;
  font-size:14px;
  line-height:1.6;
}

/* CHAT */

.chat-card{
  overflow:hidden;
  border:1px solid rgba(0,229,255,.18);
  border-radius:25px;
  background:rgba(5,10,25,.78);
  box-shadow:
    0 20px 70px rgba(0,0,0,.35),
    inset 0 0 40px rgba(0,229,255,.025);
}

.chat-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 15px;
  border-bottom:1px solid rgba(148,163,184,.10);
}

.ai-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.ai-avatar{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#06b6d4,#7c3aed);
  box-shadow:0 0 18px rgba(34,211,238,.2);
}

.ai-info strong{
  font-size:14px;
}

.ai-info span{
  display:block;
  color:#64748b;
  font-size:10px;
  margin-top:2px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.small-btn{
  border:1px solid rgba(148,163,184,.15);
  background:rgba(15,23,42,.8);
  color:#cbd5e1;
  border-radius:10px;
  padding:8px 10px;
  font-size:11px;
}

.small-btn:hover{
  border-color:#22d3ee;
  color:#67e8f9;
}

/* MESSAGES */

.messages{
  height:clamp(420px,60vh,600px);
  overflow-y:auto;
  padding:18px;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:5px;
}

.messages::-webkit-scrollbar-thumb{
  background:#164e63;
  border-radius:20px;
}

.message{
  display:flex;
  margin-bottom:15px;
  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:min(82%,720px);
  padding:12px 14px;
  border-radius:17px;
  line-height:1.6;
  font-size:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.ai .bubble{
  background:rgba(15,23,42,.9);
  border:1px solid rgba(34,211,238,.12);
  color:#dbeafe;
  border-bottom-left-radius:5px;
}

.message.user .bubble{
  background:linear-gradient(135deg,#075985,#312e81);
  border:1px solid rgba(103,232,249,.15);
  color:#fff;
  border-bottom-right-radius:5px;
}

.message-label{
  font-size:9px;
  color:#64748b;
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.user .message-label{
  text-align:right;
}

/* TYPING */

.typing{
  display:none;
  padding:0 18px 13px;
}

.typing.show{
  display:block;
}

.typing-box{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:9px 12px;
  border-radius:13px;
  background:#0f172a;
  color:#64748b;
  font-size:11px;
}

.typing-box i{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#22d3ee;
  animation:typing 1s infinite;
}

.typing-box i:nth-child(2){
  animation-delay:.15s;
}

.typing-box i:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    opacity:.25;
    transform:translateY(0);
  }
  30%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* QUICK */

.quick{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:0 15px 12px;
}

.quick button{
  flex:0 0 auto;
  border:1px solid rgba(34,211,238,.13);
  background:rgba(8,47,73,.35);
  color:#7dd3fc;
  border-radius:999px;
  padding:7px 11px;
  font-size:10px;
}

/* INPUT */

.input-area{
  padding:12px;
  border-top:1px solid rgba(148,163,184,.10);
  background:rgba(2,6,23,.75);
}

.input-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}

#messageInput{
  width:100%;
  min-height:48px;
  max-height:150px;
  resize:none;
  border:1px solid rgba(148,163,184,.15);
  outline:none;
  border-radius:15px;
  padding:13px 14px;
  color:#e2e8f0;
  background:#020617;
  line-height:1.45;
}

#messageInput:focus{
  border-color:rgba(34,211,238,.45);
  box-shadow:0 0 0 3px rgba(34,211,238,.05);
}

.icon-btn{
  flex:0 0 48px;
  width:48px;
  height:48px;
  border-radius:15px;
  border:1px solid rgba(148,163,184,.15);
  background:#0f172a;
  color:#cbd5e1;
  font-size:20px;
  transition:.2s;
}

.icon-btn:hover{
  transform:translateY(-1px);
  border-color:#22d3ee;
}

#voiceBtn.listening{
  color:#fff;
  border-color:#ef4444;
  background:rgba(127,29,29,.55);
  box-shadow:0 0 25px rgba(239,68,68,.25);
  animation:pulseVoice 1.2s infinite;
}

@keyframes pulseVoice{
  50%{
    box-shadow:0 0 35px rgba(239,68,68,.45);
  }
}

#sendBtn{
  background:linear-gradient(135deg,#0891b2,#6d28d9);
  border-color:transparent;
  color:#fff;
}

/* VOICE PANEL */

.voice-panel{
  display:none;
  margin-top:10px;
  padding:11px 13px;
  border-radius:14px;
  border:1px solid rgba(34,211,238,.15);
  background:rgba(8,47,73,.22);
}

.voice-panel.show{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.voice-status{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:11px;
  color:#67e8f9;
}

.voice-wave{
  display:flex;
  align-items:center;
  gap:3px;
  height:20px;
}

.voice-wave span{
  width:3px;
  height:7px;
  border-radius:4px;
  background:#22d3ee;
  animation:wave .7s infinite alternate;
}

.voice-wave span:nth-child(2){animation-delay:.1s}
.voice-wave span:nth-child(3){animation-delay:.2s}
.voice-wave span:nth-child(4){animation-delay:.3s}
.voice-wave span:nth-child(5){animation-delay:.4s}

@keyframes wave{
  to{
    height:18px;
  }
}

.voice-stop{
  border:1px solid rgba(248,113,113,.25);
  color:#fca5a5;
  background:rgba(127,29,29,.2);
  border-radius:9px;
  padding:6px 9px;
  font-size:10px;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#475569;
  font-size:10px;
  padding-top:15px;
}

/* MOBILE */

@media(max-width:650px){

  .app{
    width:96%;
    padding-top:8px;
  }

  .header{
    top:5px;
    padding:11px 12px;
    border-radius:17px;
  }

  .brand h1{
    font-size:14px;
  }

  .status{
    font-size:9px;
  }

  .hero{
    padding:12px 5px;
  }

  .hero h2{
    font-size:28px;
  }

  .hero p{
    font-size:12px;
  }

  .chat-card{
    border-radius:20px;
  }

  .messages{
    height:55vh;
    min-height:390px;
    padding:14px 11px;
  }

  .bubble{
    max-width:90%;
    font-size:13px;
  }

  .chat-top{
    padding:11px;
  }

  .small-btn{
    padding:7px 8px;
    font-size:10px;
  }

  .input-area{
    padding:9px;
  }

  .icon-btn{
    width:44px;
    height:44px;
    flex-basis:44px;
    border-radius:13px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="brand">

    <div class="logo">AI</div>

    <div>
      <h1>ALFA AI</h1>
      <small>NATURAL VOICE • V5.7</small>
    </div>

  </div>

  <div class="status">
    <span class="dot"></span>
    ONLINE
  </div>

</header>


<section class="hero">

  <h2>Talk Naturally With AI.</h2>

  <p>
    Ngobrol dengan ALFA AI menggunakan bahasa Indonesia
    atau English secara natural.
  </p>

</section>


<main class="chat-card">

  <div class="chat-top">

    <div class="ai-info">

      <div class="ai-avatar">✦</div>

      <div>
        <strong>ALFA AI Assistant</strong>
        <span>Natural Text + Voice Conversation</span>
      </div>

    </div>

    <div class="top-actions">

      <button
        class="small-btn"
        onclick="clearChat()">
        Hapus Chat
      </button>

    </div>

  </div>


  <div id="messages" class="messages"></div>


  <div id="typing" class="typing">

    <div class="typing-box">

      ALFA AI sedang berpikir

      <i></i>
      <i></i>
      <i></i>

    </div>

  </div>


  <div class="quick">

    <button onclick="quickAsk('Jelaskan sesuatu dengan bahasa yang mudah dipahami.')">
      💡 Jelaskan
    </button>

    <button onclick="quickAsk('Help me come up with a creative idea.')">
      🚀 English
    </button>

    <button onclick="quickAsk('Bantu saya membuat sesuatu yang profesional.')">
      ✨ Buatkan
    </button>

    <button onclick="quickAsk('Mari ngobrol santai.')">
      💬 Ngobrol
    </button>

  </div>


  <div class="input-area">

    <div class="input-row">

      <textarea
        id="messageInput"
        placeholder="Ketik pesan atau tekan 🎙️ untuk bicara..."
        rows="1"></textarea>

      <button
        id="voiceBtn"
        class="icon-btn"
        title="Voice Chat"
        onclick="toggleVoice()">
        🎙️
      </button>

      <button
        id="sendBtn"
        class="icon-btn"
        title="Kirim"
        onclick="sendChat()">
        ➤
      </button>

    </div>


    <div id="voicePanel" class="voice-panel">

      <div class="voice-status">

        <div class="voice-wave">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <span id="voiceStatusText">
          Mendengarkan...
        </span>

      </div>

      <button
        class="voice-stop"
        onclick="stopVoice()">
        Berhenti
      </button>

    </div>

  </div>

</main>


<div class="footer">
  ALFA AI V5.7 • Natural Voice Conversation
</div>

</div>


<script>

/* =========================================================
   ALFA AI V5.7
   WORKER TETAP
========================================================= */

const CHAT_URL =
"https://shrill-haze-a236.adnan0076767.workers.dev/chat";


/* =========================================================
   NATURAL AI PERSONALITY
========================================================= */

const SYSTEM_PROMPT = `

Kamu adalah ALFA AI.

Kamu adalah asisten percakapan yang:
- ramah
- natural
- komunikatif
- responsif
- punya wawasan luas
- tidak kaku
- tidak terdengar seperti robot

ATURAN UTAMA:

1. Bahasa harus terasa seperti manusia sedang berbicara.

2. Jangan menggunakan pembukaan yang sama berulang-ulang.

3. Jangan mengatakan:
   "Sebagai AI..."
   kecuali memang sangat diperlukan.

4. Jangan menjawab seperti artikel ensiklopedia
   jika pengguna hanya sedang ngobrol.

5. Jika pengguna santai, balas santai.

6. Jika pengguna serius, balas serius.

7. Jika pengguna bercanda, boleh ikut bercanda
   secara wajar.

8. Jika pengguna meminta bantuan teknis,
   berikan solusi yang jelas dan praktis.

9. Jangan terlalu banyak bullet point
   jika jawaban percakapan biasa.

10. Jangan mengulang pertanyaan pengguna.

11. Jangan membuat jawaban terasa template.

12. Jangan menggunakan bahasa yang terlalu formal
    kecuali pengguna memintanya.

BAHASA:

- Jika pengguna berbicara Bahasa Indonesia,
  jawab Bahasa Indonesia natural.

- Jika pengguna berbicara English,
  jawab English yang natural dan conversational.

- Jika pengguna mencampur Indonesia dan English,
  ikuti gaya campuran tersebut secara natural.

- Jangan menerjemahkan secara kaku.

VOICE:

Ketika jawaban akan dibacakan:

- gunakan kalimat yang mudah diucapkan
- jangan menggunakan tabel
- jangan menggunakan markdown berlebihan
- jangan menggunakan simbol yang aneh
- jangan membuat jawaban terlalu panjang
- gunakan gaya bicara yang hangat
- variasikan panjang kalimat
- terdengar seperti teman yang pintar sedang membantu

ENGLISH:

Jika pengguna berbicara English,
gunakan conversational English.

Jangan menerjemahkan struktur Bahasa Indonesia
secara literal ke English.

Gunakan idiom English yang wajar jika sesuai konteks.

INDONESIAN:

Gunakan Bahasa Indonesia sehari-hari yang natural.

Hindari gaya:
"Adapun..."
"Selanjutnya..."
"Demikian..."
"Berdasarkan uraian tersebut..."

kecuali konteks memang membutuhkan bahasa formal.

KONTEKS:

Selalu perhatikan percakapan sebelumnya.

Jika pengguna melanjutkan topik sebelumnya,
jangan meminta mereka mengulang semuanya.

PENGETAHUAN:

Gunakan seluruh pengetahuan yang tersedia
untuk membantu pengguna dalam:
teknologi, AI, programming, website, bisnis,
desain, pendidikan, produktivitas, dan pengetahuan umum.

Jika tidak mengetahui sesuatu,
katakan dengan jujur.

Jangan mengarang fakta.

TUJUAN:

Pengguna harus merasa sedang berbicara
dengan asisten yang memahami konteks,
bukan dengan mesin yang membaca template.

`;


/* =========================================================
   STATE
========================================================= */

let conversation=[];

let isSending=false;

let isListening=false;

let currentUtterance=null;

let lastDetectedLanguage="id-ID";


const messagesEl=
document.getElementById("messages");

const inputEl=
document.getElementById("messageInput");

const typingEl=
document.getElementById("typing");

const voiceBtn=
document.getElementById("voiceBtn");

const voicePanel=
document.getElementById("voicePanel");

const voiceStatusText=
document.getElementById("voiceStatusText");


/* =========================================================
   LOAD
========================================================= */

function loadChat(){

  try{

    const saved=
    localStorage.getItem(
      "alfa_ai_v57_chat"
    );

    if(saved){

      conversation=
      JSON.parse(saved);

    }

  }catch(e){

    conversation=[];

  }


  if(!conversation.length){

    addMessage(
      "ai",
      "Halo bosss 👋 Saya ALFA AI. Mau ngobrol santai, pakai Bahasa Indonesia, atau English juga bisa."
    );

  }else{

    conversation.forEach(item=>{

      if(item.role==="user"){

        renderMessage(
          "user",
          item.content
        );

      }

      if(item.role==="assistant"){

        renderMessage(
          "ai",
          item.content
        );

      }

    });

  }

  scrollBottom();

}


/* =========================================================
   SAVE
========================================================= */

function saveChat(){

  try{

    localStorage.setItem(
      "alfa_ai_v57_chat",
      JSON.stringify(
        conversation.slice(-30)
      )
    );

  }catch(e){}

}


/* =========================================================
   RENDER
========================================================= */

function renderMessage(role,text){

  const wrapper=
  document.createElement("div");

  wrapper.className=
  "message "+role;


  const box=
  document.createElement("div");


  const label=
  document.createElement("div");

  label.className=
  "message-label";

  label.textContent=
  role==="user"
  ?"Kamu"
  :"ALFA AI";


  const bubble=
  document.createElement("div");

  bubble.className=
  "bubble";

  bubble.textContent=
  text;


  box.appendChild(label);

  box.appendChild(bubble);

  wrapper.appendChild(box);

  messagesEl.appendChild(wrapper);

}


/* =========================================================
   ADD
========================================================= */

function addMessage(role,text){

  renderMessage(
    role,
    text
  );

  scrollBottom();

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

  requestAnimationFrame(()=>{

    messagesEl.scrollTop=
    messagesEl.scrollHeight;

  });

}


/* =========================================================
   SEND
========================================================= */

async function sendChat(){

  if(isSending)return;


  const message=
  inputEl.value.trim();


  if(!message)return;


  stopSpeaking();


  inputEl.value="";

  inputEl.style.height="48px";


  lastDetectedLanguage=
  detectLanguage(message);


  addMessage(
    "user",
    message
  );


  conversation.push({

    role:"user",

    content:message

  });


  saveChat();


  isSending=true;

  typingEl.classList.add("show");


  try{

    const response=
    await fetch(
      CHAT_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({

          action:"chat",

          message:message,

          prompt:
          SYSTEM_PROMPT+

          "\n\nBahasa percakapan saat ini: "+
          lastDetectedLanguage,

          messages:
          conversation.slice(-20)

        })

      }
    );


    const raw=
    await response.text();


    let data;


    try{

      data=
      JSON.parse(raw);

    }catch(e){

      throw new Error(
        "Response Worker bukan JSON."
      );

    }


    if(!response.ok){

      throw new Error(
        data.error||
        data.message||
        "Worker HTTP "+
        response.status
      );

    }


    let reply=
      data.reply??
      data.response??
      data.message??
      data.result??
      data.text??
      data.content;


    if(
      typeof reply==="object" &&
      reply!==null
    ){

      reply=
        reply.text??
        reply.content??
        reply.reply??
        JSON.stringify(reply);

    }


    if(!reply){

      throw new Error(
        "Response AI tidak ditemukan."
      );

    }


    reply=
    String(reply).trim();


    conversation.push({

      role:"assistant",

      content:reply

    });


    saveChat();


    addMessage(
      "ai",
      reply
    );


    /* =========================
       VOICE RESPONSE
    ========================= */

    speakReply(
      reply,
      lastDetectedLanguage
    );


  }catch(error){

    console.error(error);


    addMessage(
      "ai",
      "Maaf bosss, ALFA AI sedang mengalami kendala koneksi.\n\nDetail: "+
      error.message
    );


  }finally{

    isSending=false;

    typingEl.classList.remove(
      "show"
    );

  }

}


/* =========================================================
   ENTER
========================================================= */

inputEl.addEventListener(
  "keydown",
  function(e){

    if(
      e.key==="Enter" &&
      !e.shiftKey
    ){

      e.preventDefault();

      sendChat();

    }

  }
);


/* =========================================================
   TEXTAREA
========================================================= */

inputEl.addEventListener(
  "input",
  function(){

    this.style.height=
    "auto";

    this.style.height=
    Math.min(
      this.scrollHeight,
      150
    )+"px";

  }
);


/* =========================================================
   QUICK
========================================================= */

function quickAsk(text){

  inputEl.value=text;

  inputEl.focus();

  sendChat();

}


/* =========================================================
   CLEAR
========================================================= */

function clearChat(){

  stopSpeaking();

  if(
    !confirm(
      "Hapus seluruh percakapan?"
    )
  )return;


  conversation=[];


  localStorage.removeItem(
    "alfa_ai_v57_chat"
  );


  messagesEl.innerHTML="";


  addMessage(
    "ai",
    "Oke bosss. Chat kita sudah dibersihkan. Mau mulai dari mana?"
  );

}


/* =========================================================
   LANGUAGE DETECTION
========================================================= */

function detectLanguage(text){

  const t=
  text.toLowerCase();


  const englishScore=
    countMatches(
      t,
      [
        "the",
        "is",
        "are",
        "am",
        "you",
        "your",
        "what",
        "why",
        "how",
        "can",
        "could",
        "would",
        "should",
        "please",
        "help",
        "tell",
        "explain",
        "make",
        "create",
        "build",
        "website",
        "code",
        "hello",
        "thanks",
        "thank",
        "today",
        "tomorrow",
        "where",
        "when",
        "which"
      ]
    );


  const indonesiaScore=
    countMatches(
      t,
      [
        "yang",
        "dan",
        "atau",
        "saya",
        "aku",
        "kamu",
        "anda",
        "ini",
        "itu",
        "apa",
        "kenapa",
        "mengapa",
        "bagaimana",
        "bisa",
        "tolong",
        "jelaskan",
        "buat",
        "membuat",
        "website",
        "kode",
        "hari",
        "sekarang",
        "besok",
        "dimana",
        "kapan"
      ]
    );


  if(
    englishScore >
    indonesiaScore
  ){

    return "en-US";

  }


  return "id-ID";

}


/* =========================================================
   COUNT WORDS
========================================================= */

function countMatches(
  text,
  words
){

  let score=0;


  words.forEach(word=>{

    const regex=
    new RegExp(
      "\\b"+
      word.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      )+
      "\\b",
      "g"
    );


    const matches=
    text.match(regex);


    if(matches){

      score+=
      matches.length;

    }

  });


  return score;

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;


let recognition=null;


if(SpeechRecognition){

  recognition=
  new SpeechRecognition();


  recognition.continuous=false;

  recognition.interimResults=true;

  recognition.maxAlternatives=3;


  recognition.onstart=
  function(){

    isListening=true;

    voiceBtn.classList.add(
      "listening"
    );

    voicePanel.classList.add(
      "show"
    );

    voiceStatusText.textContent=
      "Mendengarkan...";

  };


  recognition.onresult=
  function(event){

    let finalText="";

    let interimText="";


    for(
      let i=event.resultIndex;
      i<event.results.length;
      i++
    ){

      const transcript=
      event.results[i][0]
      .transcript;


      if(
        event.results[i].isFinal
      ){

        finalText+=
        transcript;

      }else{

        interimText+=
        transcript;

      }

    }


    if(finalText){

      const clean=
      finalText.trim();


      inputEl.value=
      clean;


      lastDetectedLanguage=
      detectLanguage(clean);


      voiceStatusText.textContent=
        lastDetectedLanguage==="en-US"
        ?"English detected"
        :"Bahasa Indonesia detected";


      inputEl.dispatchEvent(
        new Event("input")
      );

    }else if(interimText){

      voiceStatusText.textContent=
        "Mendengar: "+
        interimText;

    }

  };


  recognition.onerror=
  function(event){

    console.warn(
      "Speech recognition:",
      event.error
    );


    isListening=false;

    voiceBtn.classList.remove(
      "listening"
    );

    voicePanel.classList.remove(
      "show"
    );


    if(
      event.error==="not-allowed"
    ){

      addMessage(
        "ai",
        "Microphone belum mendapat izin. Pilih Allow pada izin microphone Chrome."
      );

    }

  };


  recognition.onend=
  function(){

    isListening=false;

    voiceBtn.classList.remove(
      "listening"
    );

    voicePanel.classList.remove(
      "show"
    );


    const text=
    inputEl.value.trim();


    if(
      text &&
      !isSending
    ){

      sendChat();

    }

  };

}


/* =========================================================
   START VOICE
========================================================= */

function toggleVoice(){

  stopSpeaking();


  if(!SpeechRecognition){

    addMessage(
      "ai",
      "Browser ini belum mendukung Voice Chat. Gunakan Google Chrome."
    );

    return;

  }


  if(isListening){

    stopVoice();

  }else{

    startVoice();

  }

}


function startVoice(){

  if(!recognition)return;

  if(isSending)return;


  try{

    inputEl.value="";


    /*
      Default Indonesia.
      Chrome akan menggunakan hasil recognition
      lalu kita deteksi bahasanya dari hasil final.
    */

    recognition.lang=
    "id-ID";


    recognition.start();

  }catch(error){

    console.warn(error);

  }

}


function stopVoice(){

  if(recognition){

    try{

      recognition.stop();

    }catch(e){}

  }


  isListening=false;

  voiceBtn.classList.remove(
    "listening"
  );

  voicePanel.classList.remove(
    "show"
  );

}


/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

function speakReply(
  text,
  language
){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  stopSpeaking();


  const speechText=
  cleanForSpeech(text);


  if(!speechText)return;


  const parts=
  splitSpeech(
    speechText
  );


  let index=0;


  function next(){

    if(
      index>=parts.length
    ){

      currentUtterance=null;

      return;

    }


    const part=
    parts[index++].trim();


    if(!part){

      next();

      return;

    }


    const utterance=
    new SpeechSynthesisUtterance(
      part
    );


    utterance.lang=
      language==="en-US"
      ?"en-US"
      :"id-ID";


    utterance.rate=
      language==="en-US"
      ?0.96
      :0.94;


    utterance.pitch=
      language==="en-US"
      ?1.02
      :1.03;


    utterance.volume=1;


    const voice=
      chooseBestVoice(
        utterance.lang
      );


    if(voice){

      utterance.voice=voice;

    }


    utterance.onend=
    function(){

      next();

    };


    utterance.onerror=
    function(){

      currentUtterance=null;

    };


    currentUtterance=
    utterance;


    window.speechSynthesis.speak(
      utterance
    );

  }


  next();

}


/* =========================================================
   CHOOSE BEST NATIVE VOICE
========================================================= */

function chooseBestVoice(
  lang
){

  const voices=
  window.speechSynthesis
  .getVoices();


  if(!voices.length){

    return null;

  }


  const wanted=
  lang.toLowerCase();


  const exact=
  voices.filter(
    voice=>
      voice.lang &&
      voice.lang.toLowerCase()===wanted
  );


  if(exact.length){

    return rankVoices(
      exact,
      lang
    )[0];

  }


  const base=
  wanted.split("-")[0];


  const regional=
  voices.filter(
    voice=>
      voice.lang &&
      voice.lang
      .toLowerCase()
      .startsWith(base+"-")
  );


  if(regional.length){

    return rankVoices(
      regional,
      lang
    )[0];

  }


  return null;

}


/* =========================================================
   VOICE RANKING
========================================================= */

function rankVoices(
  voices,
  lang
){

  return voices
    .map(
      voice=>({

        voice,

        score:
          voiceScore(
            voice,
            lang
          )

      })
    )
    .sort(
      (a,b)=>
      b.score-a.score
    )
    .map(
      item=>item.voice
    );

}


function voiceScore(
  voice,
  lang
){

  let score=0;


  const name=
  (voice.name||"")
  .toLowerCase();


  const vlang=
  (voice.lang||"")
  .toLowerCase();


  if(
    vlang===
    lang.toLowerCase()
  ){

    score+=100;

  }


  if(
    voice.localService
  ){

    score+=20;

  }


  /*
    Prioritaskan voice yang biasanya
    terdengar lebih natural pada sistem.
  */

  const preferred=
  [
    "natural",
    "neural",
    "premium",
    "enhanced",
    "google",
    "microsoft"
  ];


  preferred.forEach(
    word=>{

      if(
        name.includes(word)
      ){

        score+=10;

      }

    }
  );


  return score;

}


/* =========================================================
   CLEAN TEXT FOR SPEECH
========================================================= */

function cleanForSpeech(
  text
){

  return String(text)

    .replace(
      /```[\s\S]*?```/g,
      " Saya akan jelaskan bagian kodenya di chat. "
    )

    .replace(
      /`([^`]+)`/g,
      "$1"
    )

    .replace(
      /\*\*(.*?)\*\*/g,
      "$1"
    )

    .replace(
      /\*(.*?)\*/g,
      "$1"
    )

    .replace(
      /#{1,6}\s*/g,
      ""
    )

    .replace(
      /^\s*[-*+]\s+/gm,
      ""
    )

    .replace(
      /\[([^\]]+)\]\([^)]+\)/g,
      "$1"
    )

    .replace(
      /https?:\/\/\S+/gi,
      ""
    )

    .replace(
      /[•▪◾▶►]/g,
      ""
    )

    .replace(
      /\n+/g,
      ". "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();

}


/* =========================================================
   SPLIT NATURAL SENTENCES
========================================================= */

function splitSpeech(
  text
){

  const sentences=
  text.match(
    /[^.!?]+[.!?]+|[^.!?]+$/g
  )||[text];


  const result=[];


  let buffer="";


  sentences.forEach(
    sentence=>{

      const clean=
      sentence.trim();


      if(!clean)return;


      if(
        (buffer+" "+clean)
        .trim()
        .length<220
      ){

        buffer=
        (buffer+" "+clean)
        .trim();

      }else{

        if(buffer){

          result.push(buffer);

        }

        buffer=clean;

      }

    }
  );


  if(buffer){

    result.push(buffer);

  }


  return result;

}


/* =========================================================
   STOP SPEAKING
========================================================= */

function stopSpeaking(){

  if(
    "speechSynthesis" in window
  ){

    window.speechSynthesis.cancel();

  }


  currentUtterance=null;

}


/* =========================================================
   LOAD AVAILABLE VOICES
========================================================= */

function refreshVoices(){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  window.speechSynthesis
  .getVoices();

}


if(
  "speechSynthesis" in window
){

  window.speechSynthesis
  .onvoiceschanged=
  refreshVoices;

}


/* =========================================================
   INIT
========================================================= */

loadChat();

refreshVoices();

</script>
