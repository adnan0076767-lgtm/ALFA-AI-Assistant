<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030712">
<meta name="color-scheme" content="dark">

<title>ALFA AI V5.3.2 | CHAT • VOICE • IMAGE</title>

<meta name="description" content="ALFA AI futuristic assistant dengan AI Chat, Voice Chat dan Image Pro.">
<meta name="robots" content="index,follow">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(0,212,255,.12),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(124,58,237,.14),transparent 32%),
    radial-gradient(circle at 50% 100%,rgba(0,255,170,.06),transparent 35%),
    #030712;
  color:#e5f6ff;
  overflow-x:hidden;
}

button,
textarea,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

::selection{
  background:#00d9ff;
  color:#001018;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(0,220,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,220,255,.035) 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

.orb{
  position:absolute;
  width:260px;
  height:260px;
  border-radius:50%;
  filter:blur(70px);
  opacity:.13;
  animation:floatOrb 9s ease-in-out infinite alternate;
}

.orb.one{
  top:5%;
  left:-70px;
  background:#00d9ff;
}

.orb.two{
  right:-80px;
  top:35%;
  background:#8b5cf6;
  animation-delay:2s;
}

.orb.three{
  bottom:-100px;
  left:35%;
  background:#00ffa6;
  animation-delay:4s;
}

@keyframes floatOrb{
  from{
    transform:translateY(-20px) scale(1);
  }
  to{
    transform:translateY(30px) scale(1.15);
  }
}

/* =========================================================
   HEADER
   ========================================================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  border-bottom:1px solid rgba(0,220,255,.12);
  background:rgba(3,7,18,.78);
  backdrop-filter:blur(18px);
}

.header-inner{
  width:min(1180px,94%);
  margin:auto;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  letter-spacing:1px;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#00d9ff,#7c3aed);
  color:white;
  box-shadow:
    0 0 20px rgba(0,217,255,.28),
    inset 0 0 15px rgba(255,255,255,.12);
}

.logo-text{
  line-height:1.05;
}

.logo-text strong{
  display:block;
  font-size:16px;
}

.logo-text span{
  display:block;
  margin-top:4px;
  color:#6ee7ff;
  font-size:10px;
  letter-spacing:2px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#7ee7c2;
  font-size:12px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#00ffa6;
  box-shadow:0 0 12px #00ffa6;
  animation:pulse 1.7s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.45;transform:scale(.75)}
}

/* =========================================================
   MAIN
   ========================================================= */

main{
  position:relative;
  z-index:1;
  width:min(1180px,94%);
  margin:0 auto;
  padding:35px 0 70px;
}

.hero{
  text-align:center;
  padding:20px 10px 28px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border:1px solid rgba(0,220,255,.2);
  border-radius:999px;
  background:rgba(0,220,255,.06);
  color:#77e9ff;
  font-size:11px;
  font-weight:800;
  letter-spacing:1.2px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(32px,6vw,65px);
  line-height:1;
  font-weight:950;
  letter-spacing:-2px;
  background:linear-gradient(90deg,#fff,#6ee7ff,#a78bfa,#fff);
  background-size:250% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:shine 5s linear infinite;
}

@keyframes shine{
  to{background-position:250% center}
}

.hero p{
  max-width:720px;
  margin:17px auto 0;
  color:#8ca7b7;
  line-height:1.7;
  font-size:14px;
}

/* =========================================================
   MODE BUTTONS
   ========================================================= */

.mode-bar{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:10px 0 22px;
}

.mode-btn{
  border:1px solid rgba(0,220,255,.13);
  background:rgba(7,15,30,.8);
  color:#7893a4;
  border-radius:16px;
  padding:15px 10px;
  transition:.25s;
  font-weight:800;
}

.mode-btn:hover{
  border-color:rgba(0,220,255,.4);
  color:#dffaff;
  transform:translateY(-2px);
}

.mode-btn.active{
  color:#fff;
  border-color:rgba(0,220,255,.55);
  background:
    linear-gradient(135deg,rgba(0,217,255,.12),rgba(124,58,237,.13));
  box-shadow:
    0 0 25px rgba(0,217,255,.08),
    inset 0 0 25px rgba(0,217,255,.04);
}

/* =========================================================
   PANEL
   ========================================================= */

.panel{
  display:none;
  border:1px solid rgba(0,220,255,.12);
  background:rgba(5,12,25,.82);
  border-radius:24px;
  overflow:hidden;
  box-shadow:
    0 25px 70px rgba(0,0,0,.3),
    inset 0 1px rgba(255,255,255,.025);
}

.panel.active{
  display:block;
  animation:panelIn .3s ease;
}

@keyframes panelIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.panel-head{
  padding:19px 20px;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.panel-title{
  font-size:16px;
  font-weight:900;
}

.panel-subtitle{
  color:#70899a;
  font-size:11px;
  margin-top:4px;
}

/* =========================================================
   CHAT
   ========================================================= */

.chat-box{
  height:480px;
  overflow-y:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
  scroll-behavior:smooth;
}

.chat-box::-webkit-scrollbar{
  width:6px;
}

.chat-box::-webkit-scrollbar-thumb{
  background:rgba(0,220,255,.18);
  border-radius:10px;
}

.message{
  display:flex;
  gap:10px;
  max-width:86%;
}

.message.user{
  margin-left:auto;
  flex-direction:row-reverse;
}

.avatar{
  flex:0 0 34px;
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  font-size:14px;
  background:#071525;
  border:1px solid rgba(0,220,255,.15);
}

.user .avatar{
  border-color:rgba(124,58,237,.3);
}

.bubble{
  padding:12px 14px;
  border-radius:16px;
  background:rgba(8,20,36,.9);
  border:1px solid rgba(0,220,255,.08);
  color:#d8edf5;
  line-height:1.65;
  font-size:14px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:linear-gradient(
    135deg,
    rgba(0,217,255,.12),
    rgba(124,58,237,.15)
  );
  border-color:rgba(124,58,237,.2);
}

.typing{
  display:inline-flex;
  gap:4px;
  align-items:center;
}

.typing i{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#6ee7ff;
  animation:typing 1s infinite;
}

.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}

@keyframes typing{
  0%,60%,100%{opacity:.25;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-3px)}
}

.input-area{
  padding:15px;
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;
  gap:10px;
  align-items:flex-end;
}

.input-area textarea{
  flex:1;
  min-height:52px;
  max-height:150px;
  resize:vertical;
  border:1px solid rgba(0,220,255,.12);
  background:#030b17;
  color:#eaffff;
  border-radius:15px;
  padding:14px;
  outline:none;
}

.input-area textarea:focus{
  border-color:rgba(0,220,255,.45);
  box-shadow:0 0 20px rgba(0,220,255,.06);
}

.send-btn,
.primary-btn{
  border:0;
  min-height:52px;
  padding:0 19px;
  border-radius:15px;
  background:linear-gradient(135deg,#00cfee,#5865f2);
  color:white;
  font-weight:900;
  box-shadow:0 10px 25px rgba(0,180,255,.12);
  transition:.2s;
}

.send-btn:hover,
.primary-btn:hover{
  transform:translateY(-2px);
  filter:brightness(1.1);
}

.send-btn:disabled,
.primary-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

/* =========================================================
   VOICE
   ========================================================= */

.voice-content{
  min-height:500px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:35px 20px;
}

.voice-orb{
  width:170px;
  height:170px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  margin-bottom:30px;
  background:
    radial-gradient(circle at 35% 30%,
      rgba(255,255,255,.22),
      rgba(0,217,255,.13) 25%,
      rgba(124,58,237,.16) 65%,
      rgba(0,0,0,.1));
  border:1px solid rgba(0,220,255,.3);
  box-shadow:
    0 0 45px rgba(0,217,255,.15),
    inset 0 0 45px rgba(124,58,237,.12);
  transition:.3s;
}

.voice-orb::before,
.voice-orb::after{
  content:"";
  position:absolute;
  inset:-14px;
  border-radius:50%;
  border:1px solid rgba(0,220,255,.12);
}

.voice-orb::after{
  inset:-28px;
  border-color:rgba(124,58,237,.08);
}

.voice-orb.listening{
  animation:voicePulse 1.15s infinite;
  box-shadow:
    0 0 80px rgba(0,217,255,.3),
    inset 0 0 50px rgba(124,58,237,.2);
}

@keyframes voicePulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}

.mic-icon{
  font-size:55px;
}

.voice-title{
  font-size:24px;
  font-weight:950;
}

.voice-status{
  color:#718b9c;
  margin-top:9px;
  min-height:22px;
  font-size:13px;
}

.voice-transcript{
  width:min(700px,100%);
  min-height:70px;
  margin:22px 0;
  padding:16px;
  border:1px solid rgba(0,220,255,.09);
  border-radius:16px;
  background:rgba(0,0,0,.16);
  color:#cdebf3;
  line-height:1.6;
}

.voice-controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

.voice-btn{
  border:1px solid rgba(0,220,255,.18);
  background:#071322;
  color:#bcebf5;
  padding:13px 20px;
  border-radius:14px;
  font-weight:900;
  transition:.2s;
}

.voice-btn:hover{
  transform:translateY(-2px);
  border-color:rgba(0,220,255,.45);
}

.voice-btn.start{
  background:linear-gradient(135deg,#00bcd4,#5865f2);
  border:0;
  color:#fff;
}

/* =========================================================
   IMAGE
   ========================================================= */

.image-layout{
  display:grid;
  grid-template-columns:370px 1fr;
  gap:18px;
  padding:18px;
}

.controls{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:11px;
  color:#7691a1;
  font-weight:800;
  letter-spacing:.5px;
}

.field textarea,
.field input,
.field select{
  width:100%;
  border:1px solid rgba(0,220,255,.11);
  background:#030b17;
  color:#e8fbff;
  border-radius:12px;
  outline:none;
  padding:11px 12px;
}

.field textarea{
  min-height:115px;
  resize:vertical;
}

.field textarea:focus,
.field input:focus,
.field select:focus{
  border-color:rgba(0,220,255,.42);
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.image-actions{
  display:flex;
  gap:8px;
}

.image-actions button{
  flex:1;
}

.secondary-btn{
  min-height:45px;
  padding:0 12px;
  border-radius:12px;
  border:1px solid rgba(0,220,255,.15);
  background:#071322;
  color:#a9dbe5;
  font-weight:800;
}

.preview{
  min-height:590px;
  border:1px solid rgba(0,220,255,.09);
  border-radius:18px;
  background:
    linear-gradient(
      135deg,
      rgba(0,217,255,.025),
      rgba(124,58,237,.035)
    );
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:18px;
  overflow:hidden;
}

.preview-placeholder{
  text-align:center;
  color:#526d7d;
  max-width:330px;
}

.preview-placeholder .big{
  font-size:55px;
  margin-bottom:15px;
  opacity:.55;
}

.preview img{
  max-width:100%;
  max-height:540px;
  border-radius:15px;
  object-fit:contain;
  display:block;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.image-tools{
  display:none;
  width:100%;
  gap:8px;
  margin-top:12px;
}

.image-tools button{
  flex:1;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  z-index:100;
  max-width:min(90%,500px);
  padding:12px 17px;
  border-radius:13px;
  background:rgba(7,17,30,.95);
  border:1px solid rgba(0,220,255,.2);
  box-shadow:0 15px 40px rgba(0,0,0,.35);
  color:#dffaff;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   FOOTER
   ========================================================= */

footer{
  text-align:center;
  padding:25px 15px;
  color:#506978;
  font-size:11px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:800px){
  .header-inner{
    min-height:64px;
  }

  .status{
    display:none;
  }

  main{
    width:94%;
    padding-top:25px;
  }

  .mode-bar{
    grid-template-columns:1fr;
  }

  .mode-btn{
    padding:13px;
  }

  .chat-box{
    height:55vh;
    min-height:380px;
  }

  .message{
    max-width:94%;
  }

  .input-area{
    flex-direction:column;
  }

  .input-area textarea{
    width:100%;
  }

  .send-btn{
    width:100%;
  }

  .image-layout{
    grid-template-columns:1fr;
  }

  .preview{
    min-height:420px;
  }

  .voice-orb{
    width:140px;
    height:140px;
  }

  .mic-icon{
    font-size:45px;
  }
}

@media(max-width:480px){
  .hero h1{
    letter-spacing:-1px;
  }

  .hero p{
    font-size:13px;
  }

  .panel-head{
    padding:16px;
  }

  .chat-box{
    padding:14px;
  }

  .two-col{
    grid-template-columns:1fr;
  }
}
</style>
</head>
