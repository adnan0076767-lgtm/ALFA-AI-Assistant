```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030712">
<meta name="color-scheme" content="dark">

<title>ALFA AI V7.3 | SMART VOICE • CHAT • IMAGE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(0,229,255,.12),transparent 30%),
    radial-gradient(circle at 85% 20%,rgba(124,58,237,.14),transparent 30%),
    linear-gradient(135deg,#020617,#030712 55%,#08051a);
  color:#e5faff;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(0,229,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.025) 1px,transparent 1px);
  background-size:45px 45px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(18px);
  background:rgba(2,6,23,.78);
  border-bottom:1px solid rgba(0,229,255,.16);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-weight:900;
  letter-spacing:1px;
  font-size:19px;
  color:#67e8f9;
  text-shadow:0 0 18px rgba(34,211,238,.65);
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  color:#86efac;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 14px #22c55e;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{opacity:.35;transform:scale(.75)}
}

.container{
  width:min(1100px,94%);
  margin:28px auto 60px;
}

.hero{
  text-align:center;
  padding:30px 10px 22px;
}

.hero h1{
  font-size:clamp(30px,6vw,62px);
  line-height:1;
  font-weight:1000;
  letter-spacing:-2px;
  background:linear-gradient(90deg,#67e8f9,#38bdf8,#a78bfa,#67e8f9);
  background-size:250% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:shine 6s linear infinite;
}

@keyframes shine{
  to{background-position:250% center}
}

.hero p{
  margin-top:15px;
  color:#94a3b8;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:18px;
}

.card{
  background:rgba(15,23,42,.72);
  border:1px solid rgba(103,232,249,.16);
  border-radius:22px;
  box-shadow:
    0 20px 70px rgba(0,0,0,.3),
    inset 0 0 35px rgba(34,211,238,.025);
  backdrop-filter:blur(18px);
  overflow:hidden;
}

.card-head{
  padding:18px 20px;
  border-bottom:1px solid rgba(148,163,184,.1);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.card-title{
  font-weight:800;
}

.badge{
  font-size:10px;
  padding:5px 9px;
  border-radius:999px;
  border:1px solid rgba(34,211,238,.25);
  color:#67e8f9;
  background:rgba(34,211,238,.07);
}

.chat{
  height:560px;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow:auto;
  padding:18px;
  scroll-behavior:smooth;
}

.message{
  display:flex;
  margin:10px 0;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:84%;
  padding:12px 15px;
  border-radius:16px;
  line-height:1.55;
  white-space:pre-wrap;
  font-size:14px;
}

.message.ai .bubble{
  background:rgba(30,41,59,.75);
  border:1px solid rgba(103,232,249,.1);
}

.message.user .bubble{
  background:linear-gradient(135deg,rgba(8,145,178,.55),rgba(37,99,235,.45));
  border:1px solid rgba(103,232,249,.18);
}

.composer{
  padding:14px;
  border-top:1px solid rgba(148,163,184,.1);
}

textarea{
  width:100%;
  min-height:75px;
  resize:none;
  padding:13px;
  border-radius:15px;
  border:1px solid rgba(103,232,249,.18);
  outline:none;
  background:#020617;
  color:#e0faff;
  font:inherit;
}

textarea:focus{
  border-color:#22d3ee;
  box-shadow:0 0 0 3px rgba(34,211,238,.08);
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

button{
  border:0;
  cursor:pointer;
  border-radius:12px;
  padding:11px 10px;
  color:white;
  font-weight:750;
  background:linear-gradient(135deg,#0891b2,#2563eb);
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
  filter:brightness(1.12);
}

button:active{
  transform:scale(.98);
}

button.secondary{
  background:#172033;
  border:1px solid rgba(148,163,184,.14);
}

button.danger{
  background:linear-gradient(135deg,#991b1b,#dc2626);
}

button.voice{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
}

button.image{
  background:linear-gradient(135deg,#db2777,#7c3aed);
}

.side{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.voice-panel{
  padding:18px;
}

.voice-state{
  padding:14px;
  border-radius:15px;
  background:rgba(2,6,23,.65);
  border:1px solid rgba(103,232,249,.12);
  margin-bottom:12px;
}

.voice-main{
  font-size:18px;
  font-weight:900;
  color:#67e8f9;
}

.voice-sub{
  font-size:12px;
  color:#94a3b8;
  margin-top:5px;
}

.voice-list{
  margin-top:12px;
  max-height:180px;
  overflow:auto;
}

.voice-item{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px 9px;
  margin:5px 0;
  border-radius:9px;
  background:rgba(30,41,59,.55);
  font-size:11px;
  color:#cbd5e1;
}

.voice-item strong{
  color:#67e8f9;
}

.test-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.image-panel{
  min-height:260px;
}

.image-box{
  padding:18px;
}

#imagePrompt{
  min-height:80px;
  margin-bottom:10px;
}

#imageResult{
  margin-top:14px;
  display:none;
}

#imageResult img{
  width:100%;
  border-radius:15px;
  border:1px solid rgba(103,232,249,.18);
  display:block;
}

.loading{
  display:none;
  color:#67e8f9;
  font-size:12px;
  margin-top:10px;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:.4}
}

.typing{
  display:inline-flex;
  gap:4px;
  align-items:center;
}

.typing i{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#67e8f9;
  animation:bounce 1s infinite;
}

.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  50%{transform:translateY(-4px);opacity:.35}
}

footer{
  text-align:center;
  margin-top:28px;
  color:#64748b;
  font-size:11px;
}

@media(max-width:850px){
  .grid{
    grid-template-columns:1fr;
  }

  .chat{
    height:620px;
  }
}

@media(max-width:550px){
  .buttons{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:35px;
  }

  .bubble{
    max-width:92%;
  }
}
</style>
</head>

    >
