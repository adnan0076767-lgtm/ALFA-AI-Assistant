<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030712">
<meta name="color-scheme" content="dark">

<title>ALFA AI V7.3.1 | AI CHAT • VOICE • IMAGE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(0,229,255,.12),transparent 30%),
    radial-gradient(circle at 80% 20%,rgba(124,58,237,.14),transparent 30%),
    #030712;
  color:#e5f7ff;
  overflow-x:hidden;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1100px,94%);
  margin:auto;
  padding:20px 0 40px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:18px 20px;
  margin-bottom:18px;
  border:1px solid rgba(0,229,255,.22);
  border-radius:22px;
  background:rgba(3,7,18,.78);
  backdrop-filter:blur(15px);
  box-shadow:0 0 35px rgba(0,229,255,.08);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logoIcon{
  width:48px;
  height:48px;
  display:grid;
  place-items:center;
  border-radius:15px;
  background:linear-gradient(135deg,#00e5ff,#7c3aed);
  color:#fff;
  font-size:24px;
  font-weight:900;
  box-shadow:0 0 25px rgba(0,229,255,.25);
}

.logoText h1{
  font-size:20px;
  letter-spacing:1px;
}

.logoText p{
  margin-top:3px;
  font-size:11px;
  color:#8da9b8;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  color:#7fffd4;
}

.statusDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#00ff95;
  box-shadow:0 0 12px #00ff95;
}

/* HERO */
.hero{
  text-align:center;
  padding:24px 15px 18px;
}

.hero h2{
  font-size:clamp(28px,6vw,52px);
  line-height:1.05;
  background:linear-gradient(90deg,#00e5ff,#7c3aed,#00e5ff);
  background-size:200%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:gradientMove 5s linear infinite;
}

.hero p{
  margin-top:12px;
  color:#8da9b8;
  font-size:14px;
}

@keyframes gradientMove{
  0%{background-position:0%}
  100%{background-position:200%}
}

/* MAIN CARD */
.panel{
  border:1px solid rgba(0,229,255,.18);
  border-radius:24px;
  overflow:hidden;
  background:rgba(5,10,24,.82);
  box-shadow:0 0 50px rgba(0,0,0,.3);
}

/* TOOLBAR */
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.02);
}

.btn{
  border:1px solid rgba(0,229,255,.25);
  background:rgba(0,229,255,.06);
  color:#dffaff;
  border-radius:12px;
  padding:10px 14px;
  font-weight:700;
  font-size:13px;
  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#00e5ff;
  box-shadow:0 0 18px rgba(0,229,255,.15);
}

.btn:active{
  transform:scale(.97);
}

.btn.primary{
  background:linear-gradient(135deg,#00b8d4,#2563eb);
  border-color:transparent;
  color:#fff;
}

.btn.voice{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  border-color:transparent;
}

.btn.stop{
  background:rgba(239,68,68,.1);
  border-color:rgba(239,68,68,.35);
  color:#ff8f8f;
}

/* CHAT */
.chat{
  height:480px;
  overflow-y:auto;
  padding:18px;
}

.chat::-webkit-scrollbar{
  width:7px;
}

.chat::-webkit-scrollbar-thumb{
  background:rgba(0,229,255,.25);
  border-radius:10px;
}

.message{
  display:flex;
  margin-bottom:15px;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:min(82%,760px);
  padding:13px 15px;
  border-radius:17px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
}

.message.ai .bubble{
  background:rgba(0,229,255,.055);
  border:1px solid rgba(0,229,255,.14);
}

.message.user .bubble{
  background:linear-gradient(135deg,rgba(37,99,235,.85),rgba(124,58,237,.85));
  color:#fff;
}

.message.system .bubble{
  margin:auto;
  color:#8da9b8;
  font-size:12px;
  text-align:center;
  border:1px dashed rgba(255,255,255,.12);
}

.typing{
  display:inline-flex;
  gap:4px;
  padding:3px;
}

.typing span{
  width:6px;
  height:6px;
  background:#00e5ff;
  border-radius:50%;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes typing{
  0%,80%,100%{opacity:.25;transform:translateY(0)}
  40%{opacity:1;transform:translateY(-4px)}
}

/* INPUT */
.inputArea{
  padding:14px;
  border-top:1px solid rgba(255,255,255,.07);
}

.inputRow{
  display:flex;
  gap:9px;
  align-items:flex-end;
}

textarea{
  flex:1;
  min-height:58px;
  max-height:180px;
  resize:vertical;
  border:1px solid rgba(0,229,255,.2);
  outline:none;
  border-radius:15px;
  background:#050b18;
  color:#e5f7ff;
  padding:14px;
}

textarea:focus{
  border-color:#00e5ff;
  box-shadow:0 0 18px rgba(0,229,255,.08);
}

.sendBtn{
  min-width:105px;
  height:58px;
}

/* IMAGE */
.imageBox{
  display:none;
  padding:15px;
  border-top:1px solid rgba(255,255,255,.07);
}

.imageBox.show{
  display:block;
}

.imagePrompt{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.imagePrompt input{
  flex:1;
  min-width:0;
  border:1px solid rgba(0,229,255,.2);
  background:#050b18;
  color:#fff;
  outline:none;
  border-radius:12px;
  padding:12px;
}

.imageResult{
  min-height:100px;
  display:grid;
  place-items:center;
  border-radius:18px;
  overflow:hidden;
  background:rgba(255,255,255,.02);
  border:1px dashed rgba(255,255,255,.1);
}

.imageResult img{
  display:block;
  width:100%;
  max-height:650px;
  object-fit:contain;
}

/* VOICE STATUS */
.voiceStatus{
  padding:9px 14px;
  font-size:12px;
  color:#7f9aa8;
  border-top:1px solid rgba(255,255,255,.05);
}

.voiceStatus.ok{
  color:#7fffd4;
}

.voiceStatus.error{
  color:#ff8f8f;
}

/* FOOTER */
.footer{
  text-align:center;
  color:#607886;
  font-size:11px;
  padding:20px 0 0;
}

/* MOBILE */
@media(max-width:650px){
  .app{
    width:96%;
    padding-top:10px;
  }

  .header{
    padding:13px;
    border-radius:18px;
  }

  .logoIcon{
    width:42px;
    height:42px;
  }

  .logoText h1{
    font-size:17px;
  }

  .status{
    font-size:10px;
  }

  .hero{
    padding:18px 8px;
  }

  .hero h2{
    font-size:31px;
  }

  .toolbar{
    padding:10px;
  }

  .btn{
    flex:1;
    min-width:100px;
    padding:10px 8px;
    font-size:12px;
  }

  .chat{
    height:55vh;
    min-height:380px;
    padding:12px;
  }

  .bubble{
    max-width:90%;
    font-size:13px;
  }

  .inputRow{
    flex-direction:column;
  }

  textarea{
    width:100%;
    min-height:85px;
  }

  .sendBtn{
    width:100%;
  }

  .imagePrompt{
    flex-direction:column;
  }

  .imagePrompt .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">
      <div class="logoIcon">AI</div>
      <div class="logoText">
        <h1>ALFA AI</h1>
        <p>V7.3.1 CLICK FIX • CHAT • VOICE • IMAGE</p>
      </div>
    </div>

    <div class="status">
      <span class="statusDot"></span>
      ONLINE
    </div>
  </header>

  <section class="hero">
    <h2>ALFA AI</h2>
    <p>Asisten AI futuristik dengan Chat, Neural Voice & Image Generator.</p>
  </section>

  <main class="panel">

    <div class="toolbar">

      <button type="button"
              class="btn"
              id="newChatBtn">
        🗑️ Chat Baru
      </button>

      <button type="button"
              class="btn voice"
              id="voiceInputBtn">
        🎤 Voice Input
      </button>

      <button type="button"
              class="btn"
              id="testIndonesiaBtn">
        🇮🇩 Test Indonesia
      </button>

      <button type="button"
              class="btn"
              id="testEnglishBtn">
        🇺🇸 Test English
      </button>

      <button type="button"
              class="btn"
              id="testAuraBtn">
        🔊 Test Aura
      </button>

      <button type="button"
              class="btn stop"
              id="stopVoiceBtn">
        ⏹ Stop
      </button>

      <button type="button"
              class="btn primary"
              id="imageToggleBtn">
        🖼️ Image Generator
      </button>

    </div>

    <section id="chat" class="chat"></section>

    <div id="imageBox" class="imageBox">

      <div class="imagePrompt">
        <input
          id="imagePrompt"
          type="text"
          placeholder="Contoh: futuristic cyber city, neon blue, cinematic..."
          autocomplete="off"
        >

        <button type="button"
                class="btn primary"
                id="generateImageBtn">
          ✨ Generate
        </button>
      </div>

      <div id="imageResult" class="imageResult">
        <span style="color:#607886;font-size:12px">
          Hasil gambar akan muncul di sini.
        </span>
      </div>

    </div>

    <div class="voiceStatus" id="voiceStatus">
      Voice engine siap.
    </div>

    <div class="inputArea">

      <div class="inputRow">

        <textarea
          id="messageInput"
          placeholder="Tulis pesan untuk ALFA AI..."
          spellcheck="true"
        ></textarea>

        <button type="button"
                class="btn primary sendBtn"
                id="sendBtn">
          🚀 Kirim
        </button>

      </div>

    </div>

  </main>

  <footer class="footer">
    ALFA AI V7.3.1 • Worker tetap menggunakan endpoint ALFA AI yang aktif
  </footer>

</div>

<script>
/* =========================================================
   ALFA AI V7.3.1 CLICK FIX
   WORKER TIDAK DIUBAH
========================================================= */

(() => {
  "use strict";

  const WORKER_BASE =
    "https://shrill-haze-a236.adnan0076767.workers.dev";

  const CHAT_ENDPOINT = WORKER_BASE + "/chat";
  const TTS_ENDPOINT = WORKER_BASE + "/tts";
  const IMAGE_ENDPOINT = WORKER_BASE + "/image";

  const STORAGE_KEY = "alfa_ai_v731_messages";

  let messages = [];
  let voices = [];
  let currentAudio = null;
  let recognition = null;
  let isListening = false;

  /* =========================================================
     SAFE DOM
  ========================================================= */

  function $(id){
    return document.getElementById(id);
  }

  const chat = $("chat");
  const messageInput = $("messageInput");
  const sendBtn = $("sendBtn");
  const voiceInputBtn = $("voiceInputBtn");
  const testIndonesiaBtn = $("testIndonesiaBtn");
  const testEnglishBtn = $("testEnglishBtn");
  const testAuraBtn = $("testAuraBtn");
  const stopVoiceBtn = $("stopVoiceBtn");
  const newChatBtn = $("newChatBtn");
  const imageToggleBtn = $("imageToggleBtn");
  const imageBox = $("imageBox");
  const imagePrompt = $("imagePrompt");
  const generateImageBtn = $("generateImageBtn");
  const imageResult = $("imageResult");
  const voiceStatus = $("voiceStatus");

  /* =========================================================
     STATUS
  ========================================================= */

  function setVoiceStatus(text, type = ""){
    if(!voiceStatus) return;

    voiceStatus.textContent = text;
    voiceStatus.className = "voiceStatus";

    if(type){
      voiceStatus.classList.add(type);
    }
  }

  /* =========================================================
     HTML ESCAPE
  ========================================================= */

  function escapeHTML(value){
    return String(value)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  /* =========================================================
     CHAT STORAGE
  ========================================================= */

  function loadMessages(){
    try{
      const saved = localStorage.getItem(STORAGE_KEY);

      if(saved){
        const parsed = JSON.parse(saved);

        if(Array.isArray(parsed)){
          messages = parsed
            .filter(x =>
              x &&
              (x.role === "user" || x.role === "assistant") &&
              typeof x.content === "string"
            )
            .slice(-50);
        }
      }
    }catch(error){
      console.warn("Storage load error:", error);
      messages = [];
    }
  }

  function saveMessages(){
    try{
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(messages.slice(-50))
      );
    }catch(error){
      console.warn("Storage save error:", error);
    }
  }

  /* =========================================================
     RENDER
  ========================================================= */

  function addMessage(role, content, save = true){

    if(!chat) return;

    const wrapper = document.createElement("div");
    wrapper.className = "message " +
      (role === "user" ? "user" : "ai");

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = content;

    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;

    if(save){
      messages.push({
        role,
        content
      });

      saveMessages();
    }
  }

  function renderMessages(){

    if(!chat) return;

    chat.innerHTML = "";

    if(messages.length === 0){

      addMessage(
        "assistant",
        "Halo bosss 👋 Saya ALFA AI. Silakan kirim pertanyaan atau gunakan Voice / Image Generator.",
        false
      );

      return;
    }

    messages.forEach(item => {
      addMessage(
        item.role,
        item.content,
        false
      );
    });

    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping(){

    const existing = $("typingMessage");

    if(existing){
      existing.remove();
    }

    const wrapper = document.createElement("div");
    wrapper.className = "message ai";
    wrapper.id = "typingMessage";

    wrapper.innerHTML = `
      <div class="bubble">
        <span class="typing">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
    `;

    chat.appendChild(wrapper);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping(){

    const typing = $("typingMessage");

    if(typing){
      typing.remove();
    }
  }

  /* =========================================================
     CHAT
  ========================================================= */

  function extractReply(data){

    if(!data) return "";

    if(typeof data.reply === "string"){
      return data.reply;
    }

    if(typeof data.response === "string"){
      return data.response;
    }

    if(typeof data.text === "string"){
      return data.text;
    }

    if(data.result){

      if(typeof data.result.response === "string"){
        return data.result.response;
      }

      if(typeof data.result.text === "string"){
        return data.result.text;
      }
    }

    return "";
  }

  async function sendMessage(){

    const text = messageInput.value.trim();

    if(!text) return;

    messageInput.value = "";

    addMessage("user", text);

    showTyping();

    sendBtn.disabled = true;
    sendBtn.style.opacity = ".6";

    try{

      const response = await fetch(CHAT_ENDPOINT,{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          message:text,
          messages:messages.slice(-12)
        })
      });

      const data = await response.json();

      if(!response.ok){
        throw new Error(
          data?.error ||
          "HTTP " + response.status
        );
      }

      const reply = extractReply(data);

      if(!reply){
        throw new Error(
          "Response ALFA AI tidak berisi jawaban."
        );
      }

      removeTyping();

      addMessage("assistant",reply);

      speakSmart(reply);

    }catch(error){

      console.error("CHAT ERROR:",error);

      removeTyping();

      addMessage(
        "assistant",
        "⚠️ ALFA AI mengalami masalah: " +
        (error?.message || "Unknown error")
      );

    }finally{

      sendBtn.disabled = false;
      sendBtn.style.opacity = "1";

      messageInput.focus();
    }
  }

  /* =========================================================
     KEYBOARD
  ========================================================= */

  function handleInputKeydown(event){

    if(event.key === "Enter" && !event.shiftKey){

      event.preventDefault();

      sendMessage();
    }
  }

  /* =========================================================
     SPEECH SYNTHESIS
  ========================================================= */

  function refreshVoices(){

    try{

      if(
        typeof window === "undefined" ||
        !("speechSynthesis" in window)
      ){
        voices = [];
        return;
      }

      voices = window.speechSynthesis.getVoices() || [];

      console.log(
        "ALFA AI voices:",
        voices.map(v => ({
          name:v.name,
          lang:v.lang,
          local:v.localService
        }))
      );

    }catch(error){

      console.warn(
        "Voice list error:",
        error
      );

      voices = [];
    }
  }

  function getIndonesianVoice(){

    if(!voices.length){
      return null;
    }

    const idVoices = voices.filter(v =>
      String(v.lang || "")
        .toLowerCase()
        .startsWith("id")
    );

    if(!idVoices.length){
      return null;
    }

    const preferredNames = [
      "google bahasa indonesia",
      "google indonesian",
      "microsoft gadis",
      "microsoft ardi",
      "gadis",
      "ardi"
    ];

    for(const wanted of preferredNames){

      const found = idVoices.find(v =>
        String(v.name || "")
          .toLowerCase()
          .includes(wanted)
      );

      if(found){
        return found;
      }
    }

    return idVoices.find(v => v.localService) ||
           idVoices[0] ||
           null;
  }

  function getEnglishVoice(){

    if(!voices.length){
      return null;
    }

    const enVoices = voices.filter(v =>
      String(v.lang || "")
        .toLowerCase()
        .startsWith("en")
    );

    if(!enVoices.length){
      return null;
    }

    const preferred = [
      "google us english",
      "microsoft aria",
      "microsoft jenny",
      "microsoft guy",
      "google uk english female",
      "google uk english male"
    ];

    for(const wanted of preferred){

      const found = enVoices.find(v =>
        String(v.name || "")
          .toLowerCase()
          .includes(wanted)
      );

      if(found){
        return found;
      }
    }

    return enVoices.find(v => v.localService) ||
           enVoices[0] ||
           null;
  }

  function detectLanguage(text){

    const value = String(text || "").trim();

    if(!value){
      return "id";
    }

    const englishWords = [
      "the ",
      "this ",
      "that ",
      "what ",
      "how ",
      "why ",
      "where ",
      "when ",
      "please ",
      "hello ",
      "good ",
      "can you ",
      "could you ",
      "thank you ",
      "i need ",
      "i want ",
      "tell me "
    ];

    const lower = " " + value.toLowerCase();

    let englishScore = 0;

    englishWords.forEach(word => {
      if(lower.includes(word)){
        englishScore++;
      }
    });

    return englishScore >= 2 ? "en" : "id";
  }

  function stopSpeech(){

    try{

      if(
        "speechSynthesis" in window
      ){
        window.speechSynthesis.cancel();
      }

    }catch(error){
      console.warn("Speech stop error:",error);
    }

    if(currentAudio){

      try{
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }catch(error){}

      currentAudio = null;
    }

    setVoiceStatus(
      "Voice dihentikan.",
      "ok"
    );
  }

  async function speakAura(text){

    try{

      stopSpeech();

      setVoiceStatus(
        "🔊 ALFA Neural Voice sedang berbicara..."
      );

      const response = await fetch(
        TTS_ENDPOINT,
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            text:String(text).slice(0,5000),
            speaker:"luna"
          })
        }
      );

      if(!response.ok){

        let detail = "";

        try{
          const data = await response.json();
          detail = data?.error || "";
        }catch(error){}

        throw new Error(
          detail ||
          "TTS HTTP " + response.status
        );
      }

      const blob = await response.blob();

      if(!blob || blob.size === 0){
        throw new Error("Audio kosong.");
      }

      const url = URL.createObjectURL(blob);

      currentAudio = new Audio(url);

      currentAudio.onended = () => {

        URL.revokeObjectURL(url);

        currentAudio = null;

        setVoiceStatus(
          "Neural Voice selesai.",
          "ok"
        );
      };

      currentAudio.onerror = () => {

        URL.revokeObjectURL(url);

        currentAudio = null;

        setVoiceStatus(
          "Audio gagal diputar.",
          "error"
        );
      };

      await currentAudio.play();

      return true;

    }catch(error){

      console.error(
        "AURA TTS ERROR:",
        error
      );

      currentAudio = null;

      setVoiceStatus(
        "Neural Voice gagal: " +
        (error?.message || "Unknown error"),
        "error"
      );

      return false;
    }
  }

  function speakBrowser(text, lang){

    return new Promise(resolve => {

      try{

        if(
          !("speechSynthesis" in window) ||
          typeof SpeechSynthesisUtterance === "undefined"
        ){
          resolve(false);
          return;
        }

        refreshVoices();

        const synth = window.speechSynthesis;

        synth.cancel();

        const utterance =
          new SpeechSynthesisUtterance(
            String(text).slice(0,5000)
          );

        const voice =
          lang === "id"
            ? getIndonesianVoice()
            : getEnglishVoice();

        utterance.lang =
          lang === "id"
            ? "id-ID"
            : "en-US";

        if(voice){
          utterance.voice = voice;
        }

        /*
          Sedikit lebih natural.
          Tidak memaksa voice yang tidak tersedia.
        */
        utterance.rate =
          lang === "id"
            ? 0.96
            : 0.94;

        utterance.pitch = 1;
        utterance.volume = 1;

        utterance.onstart = () => {

          setVoiceStatus(
            lang === "id"
              ? "🇮🇩 Browser Indonesian Voice aktif."
              : "🇺🇸 Browser English Voice aktif.",
            "ok"
          );
        };

        utterance.onend = () => {

          setVoiceStatus(
            "Browser Voice selesai.",
            "ok"
          );

          resolve(true);
        };

        utterance.onerror = event => {

          console.warn(
            "BROWSER VOICE ERROR:",
            event
          );

          setVoiceStatus(
            "Browser Voice gagal.",
            "error"
          );

          resolve(false);
        };

        synth.speak(utterance);

        /*
          Chrome kadang membutuhkan resume
          jika speech synthesis masuk keadaan paused.
        */
        setTimeout(() => {

          try{

            if(synth.paused){
              synth.resume();
            }

          }catch(error){}

        },150);

      }catch(error){

        console.error(
          "Browser speech error:",
          error
        );

        resolve(false);
      }

    });
  }

  async function speakSmart(text){

    const lang = detectLanguage(text);

    /*
      Indonesian:
      browser voice dipakai jika voice id-ID tersedia.

    */

    if(lang === "id"){

      refreshVoices();

      const idVoice =

          await speakBrowser(

    const auraSuccess =
      await speakAura(text);

    if(auraSuccess){

    await speakBrowser(
      text,
      "en"
    );
  }

  function setupRecognition(){

    const Recognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!Recognition){

      setVoiceStatus(
        "Voice Input tidak didukung browser ini.",
        "error"
      );

      return null;
    }

    try{

      const r = new Recognition();

      r.lang = "id-ID";
      r.continuous = false;
      r.interimResults = true;
      r.maxAlternatives = 1;

      r.onstart = () => {

        isListening = true;

        voiceInputBtn.textContent =
          "🔴 Mendengarkan...";

        setVoiceStatus(
          "🎤 Silakan bicara..."
        );
      };

      r.onresult = event => {

        let finalText = "";
        let interimText = "";

        for(
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ){

          const transcript =
            event.results[i][0].transcript;

          if(event.results[i].isFinal){
            finalText += transcript;
          }else{
            interimText += transcript;
          }
        }

        if(finalText){

          messageInput.value =
            finalText.trim();

        }else if(interimText){

          messageInput.value =
            interimText.trim();
        }
      };

      r.onerror = event => {

        console.warn(
          "Recognition error:",
          event
        );

        isListening = false;

        voiceInputBtn.textContent =
          "🎤 Voice Input";

        setVoiceStatus(
          "Voice Input: " +
          (event.error || "gagal"),
          "error"
        );
      };

      r.onend = () => {

        isListening = false;

        voiceInputBtn.textContent =
          "🎤 Voice Input";

        setVoiceStatus(
          "Voice Input selesai.",
          "ok"
        );
      };

      return r;

    }catch(error){

      console.error(
        "Recognition setup error:",
        error
      );

      return null;
    }
  }
