<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALFA AI | Voice AI Assistant V3.1</title>

<meta name="description" content="ALFA AI Voice Assistant V3.1 - Cyber AI Assistant">
<meta name="theme-color" content="#020617">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#020617;
    --panel:#07111f;
    --panel2:#0b1728;
    --line:#12304b;
    --cyan:#00eaff;
    --blue:#1688ff;
    --purple:#9b5cff;
    --green:#00ff9d;
    --red:#ff426d;
    --text:#eaf6ff;
    --muted:#7f9bb2;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 20%,rgba(0,234,255,.10),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(155,92,255,.10),transparent 30%),
        #020617;
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.08;
    background-image:
        linear-gradient(rgba(0,234,255,.35) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,234,255,.35) 1px,transparent 1px);
    background-size:45px 45px;
}

.app{
    display:flex;
    height:100vh;
    position:relative;
    z-index:1;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    background:rgba(3,10,22,.94);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:18px;
    backdrop-filter:blur(15px);
}

.logo{
    text-align:center;
    padding:10px 5px 20px;
}

.logo h1{
    font-size:25px;
    color:var(--cyan);
    letter-spacing:3px;
    text-shadow:0 0 15px rgba(0,234,255,.6);
}

.logo span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:7px;
    letter-spacing:2px;
}

.new-chat{
    width:100%;
    border:1px solid var(--cyan);
    background:rgba(0,234,255,.06);
    color:var(--cyan);
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:.25s;
}

.new-chat:hover{
    background:rgba(0,234,255,.16);
    box-shadow:0 0 18px rgba(0,234,255,.25);
}

.side-title{
    color:var(--muted);
    font-size:11px;
    letter-spacing:2px;
    margin:25px 4px 10px;
}

.history{
    flex:1;
    overflow:auto;
}

.history-item{
    padding:11px;
    border-radius:8px;
    margin-bottom:7px;
    background:rgba(255,255,255,.025);
    border:1px solid transparent;
    cursor:pointer;
    color:#b9d0df;
    font-size:13px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.history-item:hover{
    border-color:var(--line);
    background:rgba(0,234,255,.05);
}

.side-bottom{
    border-top:1px solid var(--line);
    padding-top:14px;
}

.clear-btn{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid rgba(255,66,109,.35);
    background:rgba(255,66,109,.05);
    color:#ff7190;
    cursor:pointer;
}

.status{
    margin-top:10px;
    text-align:center;
    font-size:11px;
    color:var(--green);
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.topbar{
    height:68px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:rgba(3,10,22,.65);
    backdrop-filter:blur(12px);
}

.top-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.online{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 14px var(--green);
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:.35}
}

.top-title strong{
    font-size:15px;
    letter-spacing:1px;
}

.version{
    font-size:10px;
    color:var(--cyan);
    border:1px solid var(--line);
    padding:5px 8px;
    border-radius:6px;
}

/* CHAT */

.chat{
    flex:1;
    overflow:auto;
    padding:28px max(18px,5vw);
    scroll-behavior:smooth;
}

.welcome{
    max-width:850px;
    margin:30px auto;
    text-align:center;
    padding:30px;
}

.ai-orb{
    width:105px;
    height:105px;
    margin:0 auto 22px;
    border-radius:50%;
    border:1px solid var(--cyan);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:43px;
    background:radial-gradient(circle,rgba(0,234,255,.18),rgba(0,234,255,.02));
    box-shadow:
        0 0 25px rgba(0,234,255,.35),
        inset 0 0 25px rgba(0,234,255,.15);
    animation:orb 3s ease-in-out infinite;
}

@keyframes orb{
    0%,100%{
        transform:scale(1);
        box-shadow:0 0 25px rgba(0,234,255,.35);
    }
    50%{
        transform:scale(1.05);
        box-shadow:0 0 45px rgba(0,234,255,.6);
    }
}

.welcome h2{
    color:var(--cyan);
    margin-bottom:10px;
}

.welcome p{
    color:var(--muted);
    line-height:1.7;
}

.quick{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin-top:22px;
}

.quick button{
    background:rgba(0,234,255,.04);
    border:1px solid var(--line);
    color:#9ec4d9;
    padding:8px 12px;
    border-radius:20px;
    cursor:pointer;
}

.quick button:hover{
    border-color:var(--cyan);
    color:var(--cyan);
}

/* MESSAGE */

.message{
    display:flex;
    margin:18px auto;
    max-width:950px;
    gap:11px;
}

.message.user{
    justify-content:flex-end;
}

.avatar{
    width:36px;
    height:36px;
    min-width:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line);
    background:var(--panel2);
}

.user .avatar{
    order:2;
}

.bubble{
    max-width:min(780px,80%);
    padding:13px 15px;
    border-radius:13px;
    line-height:1.65;
    font-size:14px;
    white-space:pre-wrap;
    word-break:break-word;
}

.user .bubble{
    background:linear-gradient(135deg,#0b3150,#09243b);
    border:1px solid #14527a;
    color:#dff7ff;
    border-bottom-right-radius:3px;
}

.ai .bubble{
    background:rgba(8,20,34,.9);
    border:1px solid var(--line);
    color:#c9dce8;
    border-bottom-left-radius:3px;
}

.ai-actions{
    display:flex;
    gap:7px;
    margin-top:9px;
}

.voice-btn{
    border:1px solid var(--line);
    background:rgba(0,234,255,.04);
    color:#8eb3c7;
    padding:6px 9px;
    border-radius:7px;
    cursor:pointer;
    font-size:11px;
}

.voice-btn:hover{
    border-color:var(--cyan);
    color:var(--cyan);
}

.voice-btn.speaking{
    color:var(--green);
    border-color:var(--green);
}

/* TYPING */

.typing{
    display:flex;
    gap:5px;
    padding:6px 2px;
}

.typing span{
    width:7px;
    height:7px;
    background:var(--cyan);
    border-radius:50%;
    animation:typing .8s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes typing{
    0%,100%{opacity:.2;transform:translateY(0)}
    50%{opacity:1;transform:translateY(-4px)}
}

/* INPUT */

.input-area{
    padding:15px max(15px,4vw) 20px;
    border-top:1px solid var(--line);
    background:rgba(2,8,18,.88);
    backdrop-filter:blur(15px);
}

.input-box{
    max-width:950px;
    margin:auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:#071321;
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px;
    transition:.25s;
}

.input-box:focus-within{
    border-color:var(--cyan);
    box-shadow:0 0 20px rgba(0,234,255,.09);
}

textarea{
    flex:1;
    resize:none;
    min-height:42px;
    max-height:140px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:11px 8px;
    font-size:14px;
    font-family:inherit;
}

textarea::placeholder{
    color:#557083;
}

.action-btn{
    width:43px;
    height:43px;
    min-width:43px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#091b2d;
    color:#a8c7d9;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}

.action-btn:hover{
    border-color:var(--cyan);
    color:var(--cyan);
}

.send-btn{
    background:linear-gradient(135deg,#006f91,#004a72);
    color:white;
    border-color:#00a9d0;
}

.send-btn:hover{
    box-shadow:0 0 18px rgba(0,234,255,.25);
}

.mic-btn{
    position:relative;
}

.mic-btn.recording{
    background:rgba(255,66,109,.16);
    border-color:var(--red);
    color:#ff5d83;
    animation:micPulse 1s infinite;
}

@keyframes micPulse{
    0%,100%{
        box-shadow:0 0 0 rgba(255,66,109,0);
    }
    50%{
        box-shadow:0 0 22px rgba(255,66,109,.45);
    }
}

.voice-status{
    max-width:950px;
    margin:7px auto 0;
    height:17px;
    text-align:center;
    font-size:11px;
    color:var(--muted);
}

.voice-status.active{
    color:#ff7190;
}

/* MOBILE */

.mobile-menu{
    display:none;
    border:1px solid var(--line);
    background:transparent;
    color:var(--cyan);
    width:38px;
    height:38px;
    border-radius:8px;
    cursor:pointer;
}

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        z-index:20;
        transition:.3s;
        box-shadow:10px 0 30px rgba(0,0,0,.5);
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        padding:0 12px;
    }

    .top-title{
        gap:7px;
    }

    .version{
        display:none;
    }

    .chat{
        padding:18px 10px;
    }

    .welcome{
        margin:15px auto;
        padding:18px 8px;
    }

    .ai-orb{
        width:85px;
        height:85px;
        font-size:34px;
    }

    .bubble{
        max-width:85%;
        font-size:13px;
    }

    .input-area{
        padding:10px 8px 13px;
    }

    .input-box{
        gap:5px;
    }

    .action-btn{
        width:40px;
        min-width:40px;
        height:40px;
    }
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-track{
    background:#020617;
}

::-webkit-scrollbar-thumb{
    background:#12304b;
    border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
    background:#185778;
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <h1>ALFA AI</h1>
            <span>VOICE COMMAND CENTER</span>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ NEW CHAT
        </button>

        <div class="side-title">
            CHAT HISTORY
        </div>

        <div class="history" id="history"></div>

        <div class="side-bottom">

            <button class="clear-btn" onclick="clearHistory()">
                🗑 CLEAR MEMORY
            </button>

            <div class="status">
                ● AI SYSTEM ONLINE
            </div>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="top-title">

                <button class="mobile-menu" onclick="toggleSidebar()">
                    ☰
                </button>

                <div class="online"></div>

                <strong>ALFA AI ASSISTANT</strong>

                <span class="version">
                    V3.1 VOICE
                </span>

            </div>

            <div style="font-size:11px;color:#6f8da1;">
                CLOUD AI
            </div>

        </header>

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <div class="ai-orb">
                    🤖
                </div>

                <h2>ALFA AI</h2>

                <p>
                    Halo Bosss 👋<br>
                    Saya ALFA AI V3.1 dengan Voice Chat.
                    Tekan 🎙️ untuk berbicara atau ketik pesan biasa.
                </p>

                <div class="quick">

                    <button onclick="quickAsk('Jelaskan apa itu OSINT dengan sederhana')">
                        🔎 Belajar OSINT
                    </button>

                    <button onclick="quickAsk('Bantu saya membuat website profesional')">
                        🌐 Website
                    </button>

                    <button onclick="quickAsk('Beri saya ide bisnis digital sederhana')">
                        💡 Ide Bisnis
                    </button>

                    <button onclick="quickAsk('Apa yang bisa kamu lakukan?')">
                        🤖 Kemampuan AI
                    </button>

                </div>

            </div>

        </section>

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    placeholder="Ketik pesan atau tekan 🎙️ untuk berbicara..."
                    rows="1"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                ></textarea>

                <button
                    class="action-btn mic-btn"
                    id="micBtn"
                    onclick="toggleVoice()"
                    title="Voice Input"
                >
                    🎙️
                </button>

                <button
                    class="action-btn send-btn"
                    onclick="sendMessage()"
                    title="Kirim"
                >
                    ➤
                </button>

            </div>

            <div class="voice-status" id="voiceStatus">
                Voice siap digunakan
            </div>

        </div>

    </main>

</div>

<script>

/* =========================================
   ALFA AI V3.1
   API CONFIG
========================================= */

const API_URL =
"https://shrill-haze-a236.adnan0076767.workers.dev/chat";


/* =========================================
   STATE
========================================= */

let messages = [];

let recognition = null;

let isRecording = false;

let currentUtterance = null;


/* =========================================
   LOAD MEMORY
========================================= */

function loadMemory(){

    try{

        const saved =
            localStorage.getItem("alfa_ai_messages");

        if(saved){

            messages = JSON.parse(saved);

            renderMessages();

        }

    }catch(error){

        console.error(error);

        messages = [];

    }

}


/* =========================================
   SAVE MEMORY
========================================= */

function saveMemory(){

    try{

        localStorage.setItem(
            "alfa_ai_messages",
            JSON.stringify(messages)
        );

    }catch(error){

        console.error(error);

    }

}


/* =========================================
   RENDER
========================================= */

function renderMessages(){

    const chat =
        document.getElementById("chat");

    const welcome =
        document.getElementById("welcome");

    if(welcome){

        welcome.style.display =
            messages.length ? "none" : "block";

    }

    chat.innerHTML = "";

    if(!messages.length){

        chat.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="ai-orb">
                🤖
            </div>

            <h2>ALFA AI</h2>

            <p>
                Halo Bosss 👋<br>
                Saya ALFA AI V3.1 dengan Voice Chat.
                Tekan 🎙️ untuk berbicara atau ketik pesan biasa.
            </p>

            <div class="quick">

                <button onclick="quickAsk('Jelaskan apa itu OSINT dengan sederhana')">
                    🔎 Belajar OSINT
                </button>

                <button onclick="quickAsk('Bantu saya membuat website profesional')">
                    🌐 Website
                </button>

                <button onclick="quickAsk('Beri saya ide bisnis digital sederhana')">
                    💡 Ide Bisnis
                </button>

                <button onclick="quickAsk('Apa yang bisa kamu lakukan?')">
                    🤖 Kemampuan AI
                </button>

            </div>

        </div>
        `;

        return;
    }

    messages.forEach((msg,index)=>{

        addMessageToDOM(
            msg.role,
            msg.content,
            false,
            index
        );

    });

    scrollBottom();

    updateHistory();

}


/* =========================================
   ADD MESSAGE
========================================= */

function addMessageToDOM(
    role,
    content,
    animate=false,
    index=-1
){

    const chat =
        document.getElementById("chat");

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (role === "user" ? "user" : "ai");

    const avatar =
        document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
        role === "user" ? "👤" : "🤖";

    const contentWrap =
        document.createElement("div");

    contentWrap.style.maxWidth = "100%";

    const bubble =
        document.createElement("div");

    bubble.className = "bubble";

    contentWrap.appendChild(bubble);

    if(role === "ai"){

        const actions =
            document.createElement("div");

        actions.className = "ai-actions";

        const speakBtn =
            document.createElement("button");

        speakBtn.className =
            "voice-btn";

        speakBtn.innerHTML =
            "🔊 Dengarkan";

        speakBtn.onclick =
            () => speakText(content,speakBtn);

        actions.appendChild(speakBtn);

        contentWrap.appendChild(actions);

    }

    wrapper.appendChild(avatar);

    wrapper.appendChild(contentWrap);

    chat.appendChild(wrapper);

    if(animate){

        typeText(
            bubble,
            content
        );

    }else{

        bubble.textContent =
            content;

    }

}


/* =========================================
   TYPING EFFECT
========================================= */

function typeText(element,text){

    let i = 0;

    element.textContent = "";

    const timer =
        setInterval(()=>{

            element.textContent +=
                text.charAt(i);

            i++;

            scrollBottom();

            if(i >= text.length){

                clearInterval(timer);

            }

        },8);

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

    const input =
        document.getElementById("input");

    const text =
        input.value.trim();

    if(!text) return;

    input.value = "";

    autoResize(input);

    if(isRecording){

        stopVoice();

    }

    messages.push({
        role:"user",
        content:text
    });

    saveMemory();

    renderMessages();

    showTyping();

    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        message:text
                    })
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const data =
            await response.json();

        removeTyping();

        const answer =
            data.response ||
            data.result ||
            data.message ||
            "Maaf Bosss, AI belum memberikan jawaban.";

        messages.push({
            role:"assistant",
            content:answer
        });

        saveMemory();

        addMessageToDOM(
            "assistant",
            answer,
            true,
            messages.length-1
        );

        updateHistory();

        scrollBottom();

    }catch(error){

        console.error(error);

        removeTyping();

        const errorMessage =
            "⚠️ Koneksi ke ALFA AI gagal. Pastikan Cloudflare Worker sedang online.";

        messages.push({
            role:"assistant",
            content:errorMessage
        });

        saveMemory();

        addMessageToDOM(
            "assistant",
            errorMessage,
            true
        );

        updateHistory();

    }

}


/* =========================================
   TYPING INDICATOR
========================================= */

function showTyping(){

    removeTyping();

    const chat =
        document.getElementById("chat");

    const wrapper =
        document.createElement("div");

    wrapper.id = "typingMessage";

    wrapper.className =
        "message ai";

    wrapper.innerHTML = `

        <div class="avatar">
            🤖
        </div>

        <div class="bubble">

            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    chat.appendChild(wrapper);

    scrollBottom();

}


function removeTyping(){

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if(typing){

        typing.remove();

    }

}


/* =========================================
   VOICE RECOGNITION
========================================= */

function initRecognition(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        recognition = null;

        return;

    }

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "id-ID";

    recognition.continuous =
        false;

    recognition.interimResults =
        true;

    recognition.maxAlternatives =
        1;


    recognition.onstart = function(){

        isRecording = true;

        const mic =
            document.getElementById(
                "micBtn"
            );

        const status =
            document.getElementById(
                "voiceStatus"
            );

        mic.classList.add(
            "recording"
        );

        mic.innerHTML =
            "⏹️";

        status.textContent =
            "🔴 Mendengarkan... silakan bicara";

        status.classList.add(
            "active"
        );

    };


    recognition.onresult = function(event){

        let transcript = "";

        for(
            let i=event.resultIndex;
            i<event.results.length;
            i++
        ){

            transcript +=
                event.results[i][0]
                    .transcript;

        }

        const input =
            document.getElementById(
                "input"
            );

        input.value =
            transcript;

        autoResize(input);

    };


    recognition.onerror =
        function(event){

            console.error(
                "Voice error:",
                event.error
            );

            let message =
                "Voice error";

            if(event.error === "not-allowed"){

                message =
                    "⚠️ Izin microphone ditolak. Izinkan microphone di browser.";

            }else if(event.error === "no-speech"){

                message =
                    "Tidak ada suara terdeteksi.";

            }else if(event.error === "audio-capture"){

                message =
                    "Microphone tidak ditemukan.";

            }else{

                message =
                    "Voice error: " +
                    event.error;

            }

            document.getElementById(
                "voiceStatus"
            ).textContent = message;

        };


    recognition.onend =
        function(){

            isRecording = false;

            const mic =
                document.getElementById(
                    "micBtn"
                );

            const status =
                document.getElementById(
                    "voiceStatus"
                );

            mic.classList.remove(
                "recording"
            );

            mic.innerHTML =
                "🎙️";

            status.classList.remove(
                "active"
            );

            if(
                document.getElementById(
                    "input"
                ).value.trim()
            ){

                status.textContent =
                    "Suara berhasil diubah menjadi teks.";

            }else{

                status.textContent =
                    "Voice siap digunakan";

            }

        };

}


/* =========================================
   TOGGLE VOICE
========================================= */

function toggleVoice(){

    if(!recognition){

        alert(
            "Browser ini belum mendukung Speech Recognition. Coba gunakan Google Chrome atau Microsoft Edge."
        );

        return;

    }

    if(isRecording){

        stopVoice();

    }else{

        startVoice();

    }

}


/* =========================================
   START VOICE
========================================= */

function startVoice(){

    try{

        recognition.start();

    }catch(error){

        console.log(error);

    }

}


/* =========================================
   STOP VOICE
========================================= */

function stopVoice(){

    if(
        recognition &&
        isRecording
    ){

        recognition.stop();

    }

}


/* =========================================
   TEXT TO SPEECH
========================================= */

function speakText(text,button){

    if(
        !("speechSynthesis" in window)
    ){

        alert(
            "Browser ini belum mendukung Text-to-Speech."
        );

        return;

    }

    speechSynthesis.cancel();

    if(
        currentUtterance
    ){

        currentUtterance = null;

    }

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "id-ID";

    utterance.rate =
        1;

    utterance.pitch =
        1;

    currentUtterance =
        utterance;

    document
        .querySelectorAll(
            ".voice-btn"
        )
        .forEach(btn=>{

            btn.classList.remove(
                "speaking"
            );

            btn.innerHTML =
                "🔊 Dengarkan";

        });

    button.classList.add(
        "speaking"
    );

    button.innerHTML =
        "⏹️ Stop";

    utterance.onend =
        function(){

            button.classList.remove(
                "speaking"
            );

            button.innerHTML =
                "🔊 Dengarkan";

            currentUtterance =
                null;

        };

    utterance.onerror =
        function(){

            button.classList.remove(
                "speaking"
            );

            button.innerHTML =
                "🔊 Dengarkan";

            currentUtterance =
                null;

        };

    if(
        speechSynthesis.speaking
    ){

        speechSynthesis.cancel();

        return;

    }

    speechSynthesis.speak(
        utterance
    );

}


/* =========================================
   QUICK COMMAND
========================================= */

function quickAsk(text){

    const input =
        document.getElementById(
            "input"
        );

    input.value = text;

    autoResize(input);

    sendMessage();

}


/* =========================================
   NEW CHAT
========================================= */

function newChat(){

    messages = [];

    saveMemory();

    if(
        "speechSynthesis" in window
    ){

        speechSynthesis.cancel();

    }

    renderMessages();

    document.getElementById(
        "input"
    ).focus();

    closeSidebar();

}


/* =========================================
   CLEAR MEMORY
========================================= */

function clearHistory(){

    const confirmClear =
        confirm(
            "Hapus semua memory percakapan ALFA AI?"
        );

    if(!confirmClear){

        return;

    }

    messages = [];

    localStorage.removeItem(
        "alfa_ai_messages"
    );

    if(
        "speechSynthesis" in window
    ){

        speechSynthesis.cancel();

    }

    renderMessages();

}


/* =========================================
   HISTORY
========================================= */

function updateHistory(){

    const history =
        document.getElementById(
            "history"
        );

    history.innerHTML = "";

    if(!messages.length){

        history.innerHTML = `
            <div style="
                color:#506c7e;
                font-size:12px;
                padding:10px 4px;
            ">
                Belum ada percakapan
            </div>
        `;

        return;

    }

    const userMessages =
        messages.filter(
            m=>m.role==="user"
        );

    userMessages
        .slice()
        .reverse()
        .forEach((msg,index)=>{

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "history-item";

            item.textContent =
                msg.content;

            item.onclick =
                function(){

                    const found =
                        messages.findIndex(
                            m =>
                            m === msg
                        );

                    if(found < 0)
                        return;

                    const target =
                        document
                        .querySelectorAll(
                            ".message"
                        )[found];

                    if(target){

                        target.scrollIntoView({
                            behavior:"smooth"
                        });

                    }

                    closeSidebar();

                };

            history.appendChild(item);

        });

}


/* =========================================
   TEXTAREA
========================================= */

function autoResize(element){

    element.style.height =
        "auto";

    element.style.height =
        Math.min(
            element.scrollHeight,
            140
        ) + "px";

}


function handleKey(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


/* =========================================
   SCROLL
========================================= */

function scrollBottom(){

    const chat =
        document.getElementById(
            "chat"
        );

    setTimeout(()=>{

        chat.scrollTop =
            chat.scrollHeight;

    },30);

}


/* =========================================
   MOBILE SIDEBAR
========================================= */

function toggleSidebar(){

    document
        .getElementById(
            "sidebar"
        )
        .classList.toggle(
            "open"
        );

}


function closeSidebar(){

    document
        .getElementById(
            "sidebar"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================
   INIT
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initRecognition();

        loadMemory();

        updateHistory();

        document
            .getElementById(
                "input"
            )
            .focus();

    }
);

</script>
