<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ALFA AI V3 | AI Command Center</title>

<meta name="description"
content="ALFA AI V3 - AI Command Center dengan memory percakapan dan Cloudflare Workers AI.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#020617;
    --panel:rgba(3,7,18,.88);
    --panel2:rgba(15,23,42,.75);
    --line:rgba(56,189,248,.16);
    --cyan:#22d3ee;
    --blue:#3b82f6;
    --text:#e2e8f0;
    --muted:#64748b;
}

html,body{
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 15% 10%,rgba(6,182,212,.12),transparent 28%),
        radial-gradient(circle at 85% 85%,rgba(37,99,235,.12),transparent 30%),
        var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

/* GRID */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(34,211,238,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(34,211,238,.025) 1px,transparent 1px);
    background-size:40px 40px;
}

/* SCANLINE */

body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(
        transparent 0%,
        rgba(34,211,238,.025) 50%,
        transparent 100%
    );
    background-size:100% 7px;
    opacity:.35;
}

/* APP */

.app{
    width:min(1180px,94%);
    margin:auto;
    padding:22px 0;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:52px;
    height:52px;
    display:grid;
    place-items:center;
    border-radius:16px;
    background:rgba(8,47,73,.75);
    border:1px solid rgba(34,211,238,.35);
    box-shadow:
        0 0 25px rgba(34,211,238,.15),
        inset 0 0 20px rgba(34,211,238,.06);
    font-size:25px;
}

.brand h1{
    font-size:21px;
    letter-spacing:2px;
}

.brand p{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
    letter-spacing:1px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(15,23,42,.7);
    font-size:11px;
    color:#94a3b8;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
}

/* BUTTON */

.btn{
    border:1px solid #1e293b;
    background:#08111f;
    color:#94a3b8;
    border-radius:11px;
    padding:9px 12px;
    cursor:pointer;
    font-size:11px;
    transition:.2s;
}

.btn:hover{
    color:#67e8f9;
    border-color:#0891b2;
    transform:translateY(-1px);
}

/* MAIN */

.layout{
    display:grid;
    grid-template-columns:210px 1fr;
    gap:14px;
}

/* SIDEBAR */

.sidebar{
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--panel);
    padding:15px;
    height:calc(100vh - 115px);
    min-height:620px;
    display:flex;
    flex-direction:column;
}

.side-title{
    color:#64748b;
    font-size:10px;
    letter-spacing:1.5px;
    margin-bottom:12px;
}

.new-chat{
    width:100%;
    padding:11px;
    border:1px solid rgba(34,211,238,.25);
    border-radius:12px;
    background:rgba(8,47,73,.5);
    color:#67e8f9;
    cursor:pointer;
    margin-bottom:14px;
}

.history{
    overflow:auto;
    flex:1;
}

.history-item{
    padding:10px;
    border-radius:10px;
    margin-bottom:5px;
    cursor:pointer;
    color:#94a3b8;
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.history-item:hover{
    background:#0f172a;
    color:#67e8f9;
}

.memory-info{
    border-top:1px solid #1e293b;
    padding-top:12px;
    color:#475569;
    font-size:10px;
    line-height:1.6;
}

/* CHAT PANEL */

.panel{
    min-width:0;
    border:1px solid var(--line);
    border-radius:22px;
    background:var(--panel);
    overflow:hidden;
    box-shadow:
        0 25px 80px rgba(0,0,0,.35),
        0 0 45px rgba(14,165,233,.05);
}

/* TOP */

.panel-top{
    min-height:52px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 17px;
    border-bottom:1px solid #1e293b;
}

.panel-title{
    display:flex;
    align-items:center;
    gap:9px;
    color:#94a3b8;
    font-size:11px;
    letter-spacing:1px;
}

.live{
    color:var(--cyan);
}

/* CHAT */

.chat{
    height:calc(100vh - 300px);
    min-height:470px;
    max-height:650px;
    overflow-y:auto;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#1e3a5f;
    border-radius:20px;
}

/* MESSAGE */

.message{
    max-width:84%;
    padding:14px 16px;
    border-radius:17px;
    line-height:1.65;
    font-size:13px;
    white-space:pre-wrap;
    animation:messageIn .25s ease;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.ai{
    align-self:flex-start;
    background:rgba(15,23,42,.88);
    border:1px solid rgba(34,211,238,.12);
}

.user{
    align-self:flex-end;
    background:linear-gradient(135deg,#075985,#1d4ed8);
    border:1px solid rgba(125,211,252,.22);
}

.label{
    color:#64748b;
    font-size:9px;
    letter-spacing:1.5px;
    margin-bottom:6px;
}

.user .label{
    color:#bae6fd;
}

/* TYPING */

.typing{
    display:none;
    align-self:flex-start;
    padding:12px 16px;
    border-radius:15px;
    background:#0f172a;
    border:1px solid #1e293b;
}

.typing span{
    display:inline-block;
    width:6px;
    height:6px;
    margin:0 2px;
    border-radius:50%;
    background:#22d3ee;
    animation:blink 1.1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes blink{
    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }
    40%{
        opacity:1;
        transform:translateY(-3px);
    }
}

/* QUICK */

.quick{
    padding:0 20px 12px;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.quick button{
    border:1px solid #1e293b;
    background:#07111f;
    color:#64748b;
    border-radius:999px;
    padding:7px 11px;
    cursor:pointer;
    font-size:10px;
    transition:.2s;
}

.quick button:hover{
    color:#67e8f9;
    border-color:#0891b2;
}

/* INPUT */

.input-area{
    padding:14px;
    border-top:1px solid #1e293b;
    background:rgba(2,6,23,.95);
}

.input-row{
    display:flex;
    gap:9px;
    align-items:flex-end;
}

textarea{
    width:100%;
    min-height:52px;
    max-height:140px;
    resize:none;
    border:1px solid #1e293b;
    outline:none;
    border-radius:14px;
    background:#020617;
    color:#e2e8f0;
    padding:14px;
    font-family:inherit;
    font-size:13px;
}

textarea:focus{
    border-color:#0891b2;
    box-shadow:0 0 20px rgba(8,145,178,.1);
}

.send{
    width:52px;
    height:52px;
    flex:none;
    border:0;
    border-radius:14px;
    color:white;
    background:linear-gradient(135deg,#0891b2,#2563eb);
    cursor:pointer;
    font-size:19px;
    transition:.2s;
}

.send:hover{
    transform:translateY(-2px);
}

.send:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.footer{
    text-align:center;
    color:#334155;
    font-size:9px;
    padding:12px;
}

/* MOBILE */

@media(max-width:800px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        display:none;
    }

    .chat{
        height:58vh;
        min-height:430px;
    }

    .status{
        display:none;
    }

    .header{
        margin-bottom:12px;
    }

    .message{
        max-width:92%;
    }

}
</style>
</head>

<body>

<div class="app">

<header class="header">

    <div class="brand">

        <div class="logo">
            🤖
        </div>

        <div>
            <h1>ALFA AI</h1>
            <p>AI COMMAND CENTER • V3</p>
        </div>

    </div>

    <div class="header-actions">

        <div class="status">
            <span class="dot"></span>
            BACKEND ONLINE
        </div>

        <button class="btn" onclick="clearChat()">
            🗑️ Clear
        </button>

    </div>

</header>


<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="side-title">
            CONVERSATIONS
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div id="history" class="history"></div>

        <div class="memory-info">
            🧠 Memory lokal aktif.<br><br>
            Percakapan disimpan di browser perangkat ini menggunakan localStorage.
        </div>

    </aside>


    <!-- CHAT -->

    <main class="panel">

        <div class="panel-top">

            <div class="panel-title">
                <span class="live">●</span>
                ALFA AI ONLINE
            </div>

            <div class="panel-title">
                CLOUD AI
            </div>

        </div>


        <div id="chat" class="chat"></div>


        <div id="typing" class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>


        <div class="quick">

            <button onclick="quickAsk('Halo ALFA AI')">
                👋 Halo
            </button>

            <button onclick="quickAsk('Apa saja yang bisa kamu lakukan?')">
                🤖 Kemampuan
            </button>

            <button onclick="quickAsk('Bantu saya membuat website')">
                🌐 Website
            </button>

            <button onclick="quickAsk('Berikan ide bisnis online')">
                💡 Ide bisnis
            </button>

        </div>


        <div class="input-area">

            <div class="input-row">

                <textarea
                    id="input"
                    placeholder="Ketik pertanyaan untuk ALFA AI..."
                    autocomplete="off"
                ></textarea>

                <button
                    id="send"
                    class="send"
                    onclick="sendMessage()"
                    title="Kirim"
                >
                    ➤
                </button>

            </div>

        </div>

    </main>

</div>


<div class="footer">
    ALFA AI V3 • Cloudflare Workers AI • Local Conversation Memory
</div>

</div>


<script>

/* =====================================================
   ALFA AI V3
   BACKEND
===================================================== */

const API_URL =
"https://shrill-haze-a236.adnan0076767.workers.dev/chat";


/* =====================================================
   ELEMENTS
===================================================== */

const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const typing =
document.getElementById("typing");

const historyBox =
document.getElementById("history");


/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
"ALFA_AI_V3_MESSAGES";


let messages =
JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
);


/* =====================================================
   SAVE
===================================================== */

function saveMessages(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(messages)
    );

}


/* =====================================================
   ESCAPE / FORMAT
===================================================== */

function createMessageElement(
    type,
    text
){

    const message =
    document.createElement("div");

    message.className =
    "message " + type;


    const label =
    document.createElement("div");

    label.className =
    "label";

    label.textContent =
    type === "user"
    ? "YOU"
    : "ALFA AI";


    const content =
    document.createElement("div");

    content.textContent =
    text;


    message.appendChild(label);
    message.appendChild(content);


    return message;

}


/* =====================================================
   RENDER
===================================================== */

function renderMessages(){

    chat.innerHTML = "";


    if(messages.length === 0){

        const welcome =
        createMessageElement(
            "ai",
            "Halo bosss! 👋\n\nSaya ALFA AI V3.\n\nSekarang saya sudah terhubung ke AI sungguhan dan memiliki memory percakapan lokal di browser.\n\nSilakan mulai bertanya."
        );

        chat.appendChild(welcome);

    }else{

        messages.forEach(item => {

            chat.appendChild(
                createMessageElement(
                    item.role === "user"
                    ? "user"
                    : "ai",
                    item.content
                )
            );

        });

    }


    scrollBottom();

    renderHistory();

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

    historyBox.innerHTML = "";


    if(messages.length === 0){

        historyBox.innerHTML =
        '<div style="color:#334155;font-size:10px;padding:8px;">Belum ada percakapan.</div>';

        return;

    }


    const userMessages =
    messages.filter(
        item => item.role === "user"
    );


    userMessages
    .slice()
    .reverse()
    .slice(0,15)
    .forEach(item => {

        const el =
        document.createElement("div");

        el.className =
        "history-item";

        el.textContent =
        item.content;

        el.onclick = () => {

            input.value =
            item.content;

            input.focus();

        };


        historyBox.appendChild(el);

    });

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

    chat.scrollTop =
    chat.scrollHeight;

}


/* =====================================================
   TYPING
===================================================== */

function showTyping(){

    typing.style.display =
    "block";

    chat.appendChild(
        typing
    );

    scrollBottom();

}


function hideTyping(){

    typing.style.display =
    "none";

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const message =
    input.value.trim();


    if(!message){
        return;
    }


    messages.push({

        role:"user",

        content:message,

        time:Date.now()

    });


    saveMessages();


    chat.appendChild(
        createMessageElement(
            "user",
            message
        )
    );


    input.value = "";

    input.style.height =
    "52px";


    send.disabled =
    true;


    showTyping();


    try{

        const response =
        await fetch(
            API_URL,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify({
                    message:message
                })

            }
        );


        const data =
        await response.json();


        hideTyping();


        if(!response.ok){

            throw new Error(
                data.error ||
                "Server AI error."
            );

        }


        if(!data.success){

            throw new Error(
                data.error ||
                "AI tidak memberikan jawaban."
            );

        }


        const reply =
        data.reply ||
        "ALFA AI tidak memberikan respons.";


        messages.push({

            role:"assistant",

            content:reply,

            time:Date.now()

        });


        saveMessages();


        chat.appendChild(
            createMessageElement(
                "ai",
                reply
            )
        );


        renderHistory();


    }catch(error){

        hideTyping();


        chat.appendChild(
            createMessageElement(
                "ai",
                "⚠️ ALFA AI mengalami masalah.\n\n" +
                error.message
            )
        );

    }


    send.disabled =
    false;


    input.focus();

    scrollBottom();

}


/* =====================================================
   QUICK COMMAND
===================================================== */

function quickAsk(text){

    input.value =
    text;

    sendMessage();

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

    if(messages.length > 0){

        const confirmClear =
        confirm(
            "Mulai percakapan baru?\nPercakapan saat ini akan dihapus dari memory browser."
        );

        if(!confirmClear){
            return;
        }

    }


    messages = [];

    saveMessages();

    renderMessages();

    input.focus();

}


/* =====================================================
   CLEAR CHAT
===================================================== */

function clearChat(){

    if(messages.length === 0){
        return;
    }


    const confirmClear =
    confirm(
        "Hapus seluruh riwayat percakapan ALFA AI?"
    );


    if(!confirmClear){
        return;
    }


    messages = [];

    saveMessages();

    renderMessages();

}


/* =====================================================
   ENTER TO SEND
===================================================== */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   AUTO RESIZE
===================================================== */

input.addEventListener(
    "input",
    function(){

        this.style.height =
        "auto";

        this.style.height =
        Math.min(
            this.scrollHeight,
            140
        ) + "px";

    }
);


/* =====================================================
   START
===================================================== */

renderMessages();

input.focus();

</script>

</body>
</html>
