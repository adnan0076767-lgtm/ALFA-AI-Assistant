<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#030712">
<meta name="description" content="ALFA AI V7.3.2 - Chat, Voice, Image Generator">

<title>ALFA AI V7.3.2 | CHAT • VOICE • IMAGE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at top left,#111c3d 0%,transparent 35%),
    radial-gradient(circle at bottom right,#24104a 0%,transparent 35%),
    #030712;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.header{
  position:relative;
  padding:22px;
  margin-bottom:18px;
  border:1px solid rgba(0,220,255,.25);
  border-radius:22px;
  background:rgba(3,7,18,.82);
  box-shadow:0 0 35px rgba(0,200,255,.08);
  backdrop-filter:blur(15px);
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#00e5ff;
}

.status{
  margin-top:7px;
  color:#9ca3af;
  font-size:13px;
}

.online{
  color:#00ff99;
  font-weight:700;
}

.panel{
  border:1px solid rgba(0,220,255,.2);
  border-radius:22px;
  background:rgba(3,7,18,.82);
  box-shadow:0 0 35px rgba(0,200,255,.07);
  overflow:hidden;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:15px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.btn{
  min-height:44px;
  padding:10px 15px;
  border-radius:13px;
  color:#fff;
  background:#111827;
  border:1px solid rgba(255,255,255,.1);
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:#00e5ff;
  box-shadow:0 0 15px rgba(0,229,255,.18);
}

.btn.primary{
  background:linear-gradient(135deg,#0066ff,#00b8ff);
}

.btn.voice{
  background:linear-gradient(135deg,#5b21b6,#9333ea);
}

.btn.image{
  background:linear-gradient(135deg,#be123c,#f43f5e);
}

.btn.stop{
  background:#7f1d1d;
}

.chat{
  height:55vh;
  min-height:400px;
  overflow-y:auto;
  padding:20px;
}

.message{
  display:flex;
  margin-bottom:15px;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:82%;
  padding:13px 16px;
  border-radius:17px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user .bubble{
  background:linear-gradient(135deg,#075985,#0369a1);
  border-bottom-right-radius:5px;
}

.message.ai .bubble{
  background:#111827;
  border:1px solid rgba(255,255,255,.08);
  border-bottom-left-radius:5px;
}

.meta{
  margin-bottom:5px;
  font-size:11px;
  opacity:.6;
}

.composer{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid rgba(255,255,255,.08);
}

.input{
  flex:1;
  min-height:50px;
  resize:none;
  padding:14px;
  color:#fff;
  background:#050b18;
  border:1px solid rgba(0,220,255,.2);
  border-radius:14px;
  outline:none;
}

.input:focus{
  border-color:#00e5ff;
  box-shadow:0 0 15px rgba(0,229,255,.1);
}

.imagePanel{
  display:none;
  padding:18px;
  border-top:1px solid rgba(255,255,255,.08);
}

.imagePanel.active{
  display:block;
}

.imageInput{
  width:100%;
  min-height:100px;
  padding:14px;
  resize:vertical;
  color:#fff;
  background:#050b18;
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  outline:none;
}

.imageActions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}

.generated{
  margin-top:18px;
  text-align:center;
}

.generated img{
  display:block;
  width:100%;
  max-width:900px;
  margin:auto;
  border-radius:18px;
  border:1px solid rgba(0,229,255,.25);
  box-shadow:0 0 35px rgba(0,229,255,.12);
}

.typing{
  color:#00e5ff;
  font-size:13px;
  padding:5px 0;
}

.footer{
  padding:15px;
  text-align:center;
  color:#64748b;
  font-size:12px;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){
  .app{
    padding:10px;
  }

  .logo{
    font-size:24px;
  }

  .toolbar{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .btn{
    width:100%;
  }

  .chat{
    height:58vh;
    min-height:350px;
    padding:12px;
  }

  .bubble{
    max-width:90%;
  }

  .composer{
    flex-direction:column;
  }

  #sendBtn{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">
      ALFA <span>AI</span>
    </div>

    <div class="status">
      V7.3.2 CLICK FIX •
      <span class="online">● ONLINE</span>
      • CHAT • VOICE • IMAGE
    </div>
  </header>

  <main class="panel">

    <div class="toolbar">

      <button
        type="button"
        class="btn"
        id="newChatBtn">
        🆕 New Chat
      </button>

      <button
        type="button"
        class="btn voice"
        id="voiceInputBtn">
        🎤 Voice Input
      </button>

      <button
        type="button"
        class="btn"
        id="testIndonesiaBtn">
        🇮🇩 Test Indonesia
      </button>

      <button
        type="button"
        class="btn"
        id="testEnglishBtn">
        🇺🇸 Test English
      </button>

      <button
        type="button"
        class="btn"
        id="testAuraBtn">
        🔊 Test Aura
      </button>

      <button
        type="button"
        class="btn stop"
        id="stopVoiceBtn">
        ⛔ Stop Voice
      </button>

      <button
        type="button"
        class="btn image"
        id="imageToggleBtn">
        🖼️ Image Generator
      </button>

    </div>

    <section
      class="chat"
      id="chat">
    </section>

    <div
      class="typing hidden"
      id="typing">
      ALFA AI sedang berpikir...
    </div>

    <div class="composer">

      <textarea
        id="messageInput"
        class="input"
        placeholder="Ketik pesan untuk ALFA AI..."
        rows="2"></textarea>

      <button
        type="button"
        class="btn primary"
        id="sendBtn">
        🚀 KIRIM
      </button>

    </div>

    <section
      class="imagePanel"
      id="imagePanel">

      <textarea
        id="imagePrompt"
        class="imageInput"
        placeholder="Contoh: futuristic cyberpunk city at night, cinematic, ultra detailed"></textarea>

      <div class="imageActions">

        <button
          type="button"
          class="btn image"
          id="generateImageBtn">
          🎨 GENERATE IMAGE
        </button>

      </div>

      <div
        class="generated"
        id="generatedImage">
      </div>

    </section>

  </main>

  <footer class="footer">
    ALFA AI V7.3.2 • Neural AI Assistant
  </footer>

</div>

<script>
"use strict";

(function(){

  const WORKER_BASE =
    "https://shrill-haze-a236.adnan0076767.workers.dev";

  const STORAGE_KEY =
    "alfa_ai_v732_messages";

  let messages = [];

  let currentAudio = null;

  let recognition = null;

  let voices = [];

  let busy = false;


  /* =========================
     DOM
  ========================= */

  function $(id){
    return document.getElementById(id);
  }


  /* =========================
     SAFE TEXT
  ========================= */

  function escapeHTML(value){

    return String(value ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  /* =========================
     STORAGE
  ========================= */

  function loadMessages(){

    try{

      const raw =
        localStorage.getItem(STORAGE_KEY);

      if(!raw){
        messages = [];
        return;
      }

      const parsed =
        JSON.parse(raw);

      if(Array.isArray(parsed)){
        messages = parsed;
      }else{
        messages = [];
      }

    }catch(error){

      console.warn(
        "Storage load error:",
        error
      );

      messages = [];

    }

  }


  function saveMessages(){

    try{

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(messages)
      );

    }catch(error){

      console.warn(
        "Storage save error:",
        error
      );

    }

  }


  /* =========================
     CHAT RENDER
  ========================= */

  function renderMessages(){

    const chat = $("chat");

    if(!chat){
      return;
    }

    chat.innerHTML = "";

    if(messages.length === 0){

      addMessage(
        "assistant",
        "Halo bosss! 🔥\nSaya ALFA AI. Silakan kirim pesan."
      );

      return;

    }

    messages.forEach(function(item){

      addMessage(
        item.role,
        item.content
      );

    });

    chat.scrollTop =
      chat.scrollHeight;

  }


  function addMessage(role,text){

    const chat = $("chat");

    if(!chat){
      return;
    }

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " +
      (role === "user" ? "user" : "ai");

    const bubble =
      document.createElement("div");

    bubble.className = "bubble";

    const meta =
      document.createElement("div");

    meta.className = "meta";

    meta.textContent =
      role === "user"
        ? "YOU"
        : "ALFA AI";

    const content =
      document.createElement("div");

    content.textContent = text;

    bubble.appendChild(meta);
    bubble.appendChild(content);

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

  }


  /* =========================
     CHAT
  ========================= */

  async function sendMessage(){

    if(busy){
      return;
    }

    const input =
      $("messageInput");

    if(!input){
      return;
    }

    const text =
      input.value.trim();

    if(!text){
      return;
    }

    busy = true;

    input.value = "";

    messages.push({
      role:"user",
      content:text
    });

    saveMessages();

    renderMessages();

    $("typing")?.classList.remove("hidden");

    try{

      const response =
        await fetch(
          WORKER_BASE + "/chat",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              message:text,
              messages:messages
            })
          }
        );

      const data =
        await response.json();

      if(!response.ok ||
         !data.success){

        throw new Error(
          data.error ||
          "Chat request gagal."
        );

      }

      const reply =
        String(data.reply || "").trim();

      if(!reply){

        throw new Error(
          "AI tidak mengembalikan jawaban."
        );

      }

      messages.push({
        role:"assistant",
        content:reply
      });

      saveMessages();

      renderMessages();

      speakSmart(reply);

    }catch(error){

      console.error(
        "CHAT ERROR:",
        error
      );

      const errorText =
        "Maaf bosss, Chat Engine mengalami masalah.\n\n" +
        (error.message || error);

      messages.push({
        role:"assistant",
        content:errorText
      });

      saveMessages();

      renderMessages();

    }finally{

      busy = false;

      $("typing")?.classList.add(
        "hidden"
      );

    }

  }


  /* =========================
     VOICE
  ========================= */

  function loadVoices(){

    if(
      !("speechSynthesis" in window)
    ){
      voices = [];
      return;
    }

    voices =
      window.speechSynthesis
        .getVoices() || [];

  }


  function findIndonesianVoice(){

    loadVoices();

    const idVoices =
      voices.filter(function(v){

        const lang =
          String(v.lang || "")
            .toLowerCase();

        const name =
          String(v.name || "")
            .toLowerCase();

        return (
          lang === "id-id" ||
          lang.startsWith("id-") ||
          name.includes("indonesia") ||
          name.includes("bahasa indonesia") ||
          name.includes("gadis") ||
          name.includes("ardi")
        );

      });

    return idVoices[0] || null;

  }


  function findEnglishVoice(){

    loadVoices();

    const enVoices =
      voices.filter(function(v){

        const lang =
          String(v.lang || "")
            .toLowerCase();

        return (
          lang === "en-us" ||
          lang === "en-gb" ||
          lang.startsWith("en-")
        );

      });

    return enVoices[0] || null;

  }


  function stopVoice(){

    try{

      if(
        "speechSynthesis" in window
      ){
        window.speechSynthesis.cancel();
      }

    }catch(error){

      console.warn(
        "Speech stop error:",
        error
      );

    }

    if(currentAudio){

      try{
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }catch(error){}

      currentAudio = null;

    }

  }


  function detectLanguage(text){

    const value =
      String(text || "")
        .toLowerCase();

    const englishWords = [
      "the",
      "you",
      "your",
      "what",
      "how",
      "why",
      "please",
      "hello",
      "good",
      "morning",
      "today",
      "can",
      "could",
      "would",
      "help"
    ];

    let score = 0;

    englishWords.forEach(function(word){

      if(
        value.includes(
          " " + word + " "
        )
      ){
        score++;
      }

    });

    return score >= 2
      ? "en"
      : "id";

  }


  async function auraSpeak(
    text,
    speaker="luna"
  ){

    stopVoice();

    const response =
      await fetch(
        WORKER_BASE + "/tts",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            text:text,
            speaker:speaker
          })
        }
      );

    if(!response.ok){

      throw new Error(
        "Aura TTS HTTP " +
        response.status
      );

    }

    const blob =
      await response.blob();

    if(
      !blob ||
      !blob.size
    ){

      throw new Error(
        "Audio kosong."
      );

    }

    const url =
      URL.createObjectURL(blob);

    currentAudio =
      new Audio(url);

    currentAudio.onended =
      function(){

        URL.revokeObjectURL(url);

        currentAudio = null;

      };

    await currentAudio.play();

  }


  function browserSpeak(
    text,
    lang
  ){

    if(
      !("speechSynthesis" in window)
    ){
      return false;
    }

    stopVoice();

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );

    let voice = null;

    if(lang === "id"){
      voice =
        findIndonesianVoice();
    }else{
      voice =
        findEnglishVoice();
    }

    if(voice){

      utterance.voice =
        voice;

      utterance.lang =
        voice.lang;

    }else{

      utterance.lang =
        lang === "id"
          ? "id-ID"
          : "en-US";

    }

    utterance.rate = 1;
    utterance.pitch = 1;

    window.speechSynthesis.speak(
      utterance
    );

    return true;

  }


  async function speakSmart(text){

    const lang =
      detectLanguage(text);

    try{

      /*
       * Indonesia:
       * browser voice diprioritaskan jika
       * voice id-ID tersedia.
       */
      if(lang === "id"){

        const idVoice =
          findIndonesianVoice();

        if(idVoice){

          browserSpeak(
            text,
            "id"
          );

          return;

        }

        await auraSpeak(
          text,
          "luna"
        );

        return;

      }

      /*
       * English:
       * Aura-1 diprioritaskan.
       */
      if(lang === "en"){

        await auraSpeak(
          text,
          "luna"
        );

        return;

      }

    }catch(error){

      console.warn(
        "Primary voice failed:",
        error
      );

    }

    try{

      browserSpeak(
        text,
        lang
      );

    }catch(error){

      console.warn(
        "Browser voice failed:",
        error
      );

    }

  }


  async function testIndonesia(){

    const text =
      "Halo bosss, ini ALFA AI. Bahasa Indonesia sedang diuji.";

    try{

      const idVoice =
        findIndonesianVoice();

      if(idVoice){

        browserSpeak(
          text,
          "id"
        );

      }else{

        await auraSpeak(
          text,
          "luna"
        );

      }

    }catch(error){

      console.error(
        "Indonesia voice error:",
        error
      );

      alert(
        "Voice Indonesia gagal:\n" +
        error.message
      );

    }

  }


  async function testEnglish(){

    const text =
      "Hello boss, this is ALFA AI. English neural voice is working.";

    try{

      await auraSpeak(
        text,
        "luna"
      );

    }catch(error){

      console.error(
        "English voice error:",
        error
      );

      alert(
        "English voice gagal:\n" +
        error.message
      );

    }

  }


  async function testAura(){

    const text =
      "Halo bosss, Neural Voice ALFA AI Aura satu sedang aktif.";

    try{

      await auraSpeak(
        text,
        "luna"
      );

    }catch(error){

      console.error(
        "Aura error:",
        error
      );

      alert(
        "Aura-1 gagal:\n" +
        error.message
      );

    }

  }


  /* =========================
     VOICE INPUT
  ========================= */

  function setupRecognition(){

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){

      recognition = null;
      return;

    }

    recognition =
      new SpeechRecognition();

    recognition.lang =
      "id-ID";

    recognition.continuous =
      false;

    recognition.interimResults =
      false;

    recognition.onstart =
      function(){

        const btn =
          $("voiceInputBtn");

        if(btn){
          btn.textContent =
            "🎙️ Mendengarkan...";
        }

      };

    recognition.onresult =
      function(event){

        const result =
          event.results?.[0]?.[0]?.transcript ||
          "";

        const input =
          $("messageInput");

        if(input){

          input.value =
            result;

          input.focus();

        }

      };

    recognition.onerror =
      function(event){

        console.warn(
          "Voice input:",
          event.error
        );

      };

    recognition.onend =
      function(){

        const btn =
          $("voiceInputBtn");

        if(btn){

          btn.textContent =
            "🎤 Voice Input";

        }

      };

  }


  function startVoiceInput(){

    if(!recognition){

      alert(
        "Browser ini belum mendukung Voice Input."
      );

      return;

    }

    try{

      recognition.start();

    }catch(error){

      console.warn(
        "Recognition start:",
        error
      );

    }

  }


  /* =========================
     IMAGE
  ========================= */

  async function generateImage(){

    const prompt =
      $("imagePrompt")?.value.trim();

    if(!prompt){

      alert(
        "Masukkan prompt gambar dulu bosss."
      );

      return;

    }

    const btn =
      $("generateImageBtn");

    if(btn){

      btn.disabled = true;

      btn.textContent =
        "⏳ GENERATING...";

    }

    const output =
      $("generatedImage");

    if(output){

      output.innerHTML =
        '<div class="typing">🎨 ALFA AI sedang membuat gambar...</div>';

    }

    try{

      const response =
        await fetch(
          WORKER_BASE + "/image",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
              prompt:prompt
            })
          }
        );

      const data =
        await response.json();

      if(!response.ok ||
         !data.success){

        throw new Error(
          data.error ||
          "Image Generator gagal."
        );

      }

      if(!data.image){

        throw new Error(
          "Gambar tidak diterima."
        );

      }

      if(output){

        output.innerHTML = "";

        const img =
          document.createElement("img");

        img.src =
          data.image;

        img.alt =
          prompt;

        output.appendChild(img);

      }

    }catch(error){

      console.error(
        "IMAGE ERROR:",
        error
      );

      if(output){

        output.innerHTML =
          '<div class="typing">❌ ' +
          escapeHTML(error.message) +
          '</div>';

      }

    }finally{

      if(btn){

        btn.disabled = false;

        btn.textContent =
          "🎨 GENERATE IMAGE";

      }

    }

  }


  /* =========================
     NEW CHAT
  ========================= */

  function newChat(){

    stopVoice();

    messages = [];

    saveMessages();

    renderMessages();

    const input =
      $("messageInput");

    if(input){

      input.value = "";

      input.focus();

    }

  }


  /* =========================
     IMAGE TOGGLE
  ========================= */

  function toggleImage(){

    const panel =
      $("imagePanel");

    if(!panel){
      return;
    }

    panel.classList.toggle(
      "active"
    );

  }


  /* =========================
     EVENTS
  ========================= */

  function initEvents(){

    /*
     * Semua tombol dipasang di satu tempat.
     * Tidak ada dependency ke voice/image
     * yang boleh menghentikan event lainnya.
     */

    const send =
      $("sendBtn");

    if(send){

      send.addEventListener(
        "click",
        function(event){

          event.preventDefault();

          sendMessage();

        }
      );

    }


    const input =
      $("messageInput");

    if(input){

      input.addEventListener(
        "keydown",
        function(event){

          if(
            event.key === "Enter" &&
            !event.shiftKey
          ){

            event.preventDefault();

            sendMessage();

          }

        }
      );

    }


    const newChat =
      $("newChatBtn");

    if(newChat){

      newChat.addEventListener(
        "click",
        function(){

          newChat();

        }
      );

    }


    const voiceInput =
      $("voiceInputBtn");

    if(voiceInput){

      voiceInput.addEventListener(
        "click",
        function(){

          startVoiceInput();

        }
      );

    }


    const testID =
      $("testIndonesiaBtn");

    if(testID){

      testID.addEventListener(
        "click",
        function(){

          testIndonesia();

        }
      );

    }


    const testEN =
      $("testEnglishBtn");

    if(testEN){

      testEN.addEventListener(
        "click",
        function(){

          testEnglish();

        }
      );

    }


    const testAuraBtn =
      $("testAuraBtn");

    if(testAuraBtn){

      testAuraBtn.addEventListener(
        "click",
        function(){

          testAura();

        }
      );

    }


    const stopBtn =
      $("stopVoiceBtn");

    if(stopBtn){

      stopBtn.addEventListener(
        "click",
        function(){

          stopVoice();

        }
      );

    }


    const imageToggle =
      $("imageToggleBtn");

    if(imageToggle){

      imageToggle.addEventListener(
        "click",
        function(){

          toggleImage();

        }
      );

    }


    const generate =
      $("generateImageBtn");

    if(generate){

      generate.addEventListener(
        "click",
        function(){

          generateImage();

        }
      );

    }

  }


  /* =========================
     INITIALIZATION
  ========================= */

  function boot(){

    try{

      loadMessages();

      renderMessages();

      setupRecognition();

      loadVoices();

      initEvents();

      console.log(
        "🔥 ALFA AI V7.3.2 READY"
      );

      console.log(
        "✅ Click events initialized"
      );

    }catch(error){

      console.error(
        "ALFA BOOT ERROR:",
        error
      );

    }

  }


  if(
    document.readyState === "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      boot,
      {once:true}
    );

  }else{

    boot();

  }


  if(
    "speechSynthesis" in window
  ){

    window.speechSynthesis.onvoiceschanged =
      function(){

        loadVoices();

      };

  }

})();
</script>
