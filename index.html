<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALFA AI ASSISTANT | Cyber AI Voice Chat</title>

<meta name="theme-color" content="#030712">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#030712;
  color:#e5faff;
}

body{
  overflow-x:hidden;
}

/* BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-3;
  background:
    radial-gradient(circle at 20% 20%,rgba(0,255,255,.10),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(120,0,255,.12),transparent 35%),
    linear-gradient(135deg,#020617,#030712 50%,#050019);
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  opacity:.08;
  background-image:
    linear-gradient(rgba(0,255,255,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,255,.5) 1px,transparent 1px);
  background-size:40px 40px;
  animation:gridMove 12s linear infinite;
}

@keyframes gridMove{
  from{background-position:0 0}
  to{background-position:40px 40px}
}

/* APP */
.app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:270px;
  background:rgba(2,6,23,.88);
  border-right:1px solid rgba(0,255,255,.18);
  backdrop-filter:blur(14px);
  padding:20px;
  display:flex;
  flex-direction:column;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:20;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  color:#00f6ff;
  text-shadow:0 0 15px rgba(0,246,255,.7);
  margin-bottom:5px;
}

.logo-sub{
  color:#64748b;
  font-size:11px;
  letter-spacing:2px;
  margin-bottom:22px;
}

.new-chat{
  border:1px solid rgba(0,246,255,.45);
  background:rgba(0,246,255,.08);
  color:#8ffcff;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:.2s;
  margin-bottom:15px;
}

.new-chat:hover{
  background:rgba(0,246,255,.18);
  box-shadow:0 0 20px rgba(0,246,255,.15);
}

.history-title{
  color:#64748b;
  font-size:11px;
  letter-spacing:2px;
  margin:10px 0;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  padding:10px;
  border-radius:8px;
  color:#94a3b8;
  font-size:13px;
  margin-bottom:5px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:rgba(0,246,255,.07);
  color:#dffcff;
}

.sidebar-bottom{
  border-top:1px solid rgba(255,255,255,.07);
  padding-top:15px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:#94a3b8;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#00ff88;
  box-shadow:0 0 12px #00ff88;
}

/* MAIN */
.main{
  width:calc(100% - 270px);
  margin-left:270px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  height:70px;
  padding:0 25px;
  border-bottom:1px solid rgba(0,255,255,.12);
  background:rgba(2,6,23,.68);
  backdrop-filter:blur(14px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

.header-title{
  font-weight:bold;
  letter-spacing:1px;
}

.header-title span{
  color:#00f6ff;
}

.header-actions{
  display:flex;
  gap:8px;
}

.small-btn{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);
  color:#94a3b8;
  border-radius:8px;
  padding:8px 11px;
  cursor:pointer;
}

.small-btn:hover{
  color:#fff;
  border-color:rgba(0,246,255,.3);
}

/* CHAT */
.chat{
  flex:1;
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:30px 20px 150px;
}

.welcome{
  text-align:center;
  padding:70px 20px 30px;
}

.ai-orb{
  width:90px;
  height:90px;
  margin:0 auto 22px;
  border-radius:50%;
  border:1px solid rgba(0,246,255,.6);
  background:
    radial-gradient(circle,#00f6ff 0,#007f9c 15%,#07131f 55%,transparent 70%);
  box-shadow:
    0 0 25px rgba(0,246,255,.5),
    0 0 70px rgba(0,246,255,.12);
  animation:pulse 2.5s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 25px rgba(0,246,255,.5);
  }
  50%{
    transform:scale(1.08);
    box-shadow:0 0 45px rgba(0,246,255,.8);
  }
}

.welcome h1{
  font-size:32px;
  margin-bottom:10px;
}

.welcome h1 span{
  color:#00f6ff;
}

.welcome p{
  color:#64748b;
  max-width:600px;
  margin:auto;
  line-height:1.6;
}

/* MESSAGES */
.message{
  display:flex;
  gap:12px;
  margin:22px 0;
  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.message.user{
  justify-content:flex-end;
}

.avatar{
  width:36px;
  height:36px;
  min-width:36px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,246,255,.08);
  border:1px solid rgba(0,246,255,.25);
  color:#00f6ff;
  font-size:13px;
  font-weight:bold;
}

.user .avatar{
  order:2;
  color:#c084fc;
  border-color:rgba(192,132,252,.3);
  background:rgba(192,132,252,.08);
}

.bubble{
  max-width:min(78%,720px);
  padding:13px 15px;
  border-radius:13px;
  line-height:1.6;
  white-space:pre-wrap;
  word-wrap:break-word;
  background:rgba(15,23,42,.82);
  border:1px solid rgba(255,255,255,.06);
}

.user .bubble{
  background:rgba(88,28,135,.18);
  border-color:rgba(192,132,252,.18);
}

.ai-tools{
  display:flex;
  gap:7px;
  margin-top:8px;
}

.speak-btn{
  border:1px solid rgba(0,246,255,.18);
  background:rgba(0,246,255,.05);
  color:#67e8f9;
  border-radius:7px;
  padding:5px 8px;
  cursor:pointer;
  font-size:11px;
}

.speak-btn:hover{
  background:rgba(0,246,255,.12);
}

/* TYPING */
.typing{
  display:flex;
  gap:5px;
  align-items:center;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#00f6ff;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes typing{
  0%,60%,100%{opacity:.25;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-4px)}
}

/* QUICK COMMAND */
.quick{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0 25px;
}

.quick button{
  border:1px solid rgba(0,246,255,.16);
  background:rgba(0,246,255,.035);
  color:#7dd3fc;
  padding:8px 11px;
  border-radius:20px;
  cursor:pointer;
  font-size:12px;
}

.quick button:hover{
  background:rgba(0,246,255,.1);
}

/* INPUT */
.input-area{
  position:fixed;
  left:270px;
  right:0;
  bottom:0;
  z-index:15;
  padding:15px 20px 20px;
  background:linear-gradient(
    to top,
    rgba(3,7,18,1) 55%,
    rgba(3,7,18,.82),
    transparent
  );
}

.input-box{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px;
  background:rgba(15,23,42,.9);
  border:1px solid rgba(0,246,255,.18);
  border-radius:16px;
  box-shadow:0 0 30px rgba(0,0,0,.3);
}

#messageInput{
  flex:1;
  resize:none;
  max-height:130px;
  min-height:45px;
  border:0;
  outline:0;
  background:transparent;
  color:#e5faff;
  padding:12px;
  font-size:14px;
  font-family:inherit;
}

#messageInput::placeholder{
  color:#475569;
}

.icon-btn{
  width:45px;
  height:45px;
  min-width:45px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  color:#94a3b8;
  cursor:pointer;
  font-size:19px;
}

.icon-btn:hover{
  color:#fff;
  border-color:rgba(0,246,255,.3);
}

.mic-btn{
  color:#67e8f9;
  border-color:rgba(0,246,255,.22);
}

.mic-btn.recording{
  color:#fff;
  background:rgba(239,68,68,.18);
  border-color:rgba(239,68,68,.6);
  animation:recordPulse 1s infinite;
}

@keyframes recordPulse{
  0%,100%{box-shadow:0 0 0 rgba(239,68,68,0)}
  50%{box-shadow:0 0 20px rgba(239,68,68,.45)}
}

.send-btn{
  background:rgba(0,246,255,.12);
  color:#00f6ff;
  border-color:rgba(0,246,255,.3);
}

.send-btn:hover{
  background:rgba(0,246,255,.2);
  box-shadow:0 0 18px rgba(0,246,255,.15);
}

.voice-status{
  max-width:1000px;
  margin:7px auto 0;
  min-height:18px;
  text-align:center;
  color:#64748b;
  font-size:11px;
}

/* MOBILE */
.mobile-menu{
  display:none;
}

@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
    box-shadow:10px 0 40px rgba(0,0,0,.5);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    width:100%;
    margin-left:0;
  }

  .input-area{
    left:0;
  }

  .mobile-menu{
    display:block;
    margin-right:10px;
  }

  .header{
    padding:0 12px;
  }

  .header-title{
    font-size:13px;
  }

  .chat{
    padding:20px 12px 145px;
  }

  .welcome{
    padding:45px 10px 20px;
  }

  .welcome h1{
    font-size:25px;
  }

  .bubble{
    max-width:84%;
    font-size:14px;
  }

  .input-area{
    padding:10px 9px 13px;
  }

  .input-box{
    border-radius:13px;
  }

  .quick{
    margin-bottom:15px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="logo">ALFA AI</div>
    <div class="logo-sub">INTELLIGENT COMMAND CENTER</div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="history-title">CHAT HISTORY</div>

    <div class="history" id="history"></div>

    <div class="sidebar-bottom">
      <div class="status">
        <span class="dot"></span>
        AI SYSTEM ONLINE
      </div>
    </div>

  </aside>

  <main class="main">

    <header class="header">

      <div style="display:flex;align-items:center;">

        <button
          class="small-btn mobile-menu"
          onclick="toggleSidebar()">
          ☰
        </button>

        <div class="header-title">
          ALFA <span>AI</span> ASSISTANT
        </div>

      </div>

      <div class="header-actions">
        <button class="small-btn" onclick="clearChat()">
          Clear
        </button>
      </div>

    </header>

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="ai-orb"></div>

        <h1>
          Halo, saya <span>ALFA AI</span>
        </h1>

        <p>
          Asisten AI pribadi dengan kemampuan chat,
          voice input, dan voice response.
        </p>

      </div>

      <div class="quick" id="quick">

        <button onclick="quickSend('Halo ALFA, perkenalkan dirimu')">
          👋 Perkenalkan diri
        </button>

        <button onclick="quickSend('Bantu saya membuat website')">
          🌐 Buat Website
        </button>

        <button onclick="quickSend('Berikan saya ide bisnis online')">
          💡 Ide Bisnis
        </button>

        <button onclick="quickSend('Jelaskan teknologi AI dengan sederhana')">
          🤖 Tentang AI
        </button>

      </div>

      <div id="messages"></div>

    </section>

  </main>

</div>

<div class="input-area">

  <div class="input-box">

    <textarea
      id="messageInput"
      placeholder="Tulis pesan ke ALFA AI..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>

    <button
      class="icon-btn mic-btn"
      id="micBtn"
      onclick="toggleVoice()"
      title="Voice Chat">
      🎙️
    </button>

    <button
      class="icon-btn send-btn"
      onclick="sendMessage()"
      title="Kirim">
      ➤
    </button>

  </div>

  <div class="voice-status" id="voiceStatus"></div>

</div>

<script>

/* =====================================================
   ALFA AI V3.1 FIX FINAL
   Worker tetap sama
===================================================== */

const API_URL =
  "https://shrill-haze-a236.adnan0076767.workers.dev/chat";

const STORAGE_KEY = "alfa_ai_v31_history";

let conversation = [];
let recognition = null;
let isRecording = false;
let currentUtterance = null;


/* =====================================================
   ELEMENTS
===================================================== */

const messagesEl =
  document.getElementById("messages");

const inputEl =
  document.getElementById("messageInput");

const historyEl =
  document.getElementById("history");

const welcomeEl =
  document.getElementById("welcome");

const quickEl =
  document.getElementById("quick");

const micBtn =
  document.getElementById("micBtn");

const voiceStatus =
  document.getElementById("voiceStatus");


/* =====================================================
   LOAD MEMORY
===================================================== */

function loadMemory(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved){

      conversation =
        JSON.parse(saved);

      conversation.forEach(item => {

        addMessageToUI(
          item.role,
          item.content,
          false
        );

      });

      if(conversation.length > 0){

        welcomeEl.style.display = "none";
        quickEl.style.display = "none";

      }

    }

  }catch(error){

    console.error("Memory error:",error);

    conversation = [];

  }

  renderHistory();

}


/* =====================================================
   SAVE MEMORY
===================================================== */

function saveMemory(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(conversation)
  );

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  conversation = [];

  localStorage.removeItem(STORAGE_KEY);

  messagesEl.innerHTML = "";

  welcomeEl.style.display = "";
  quickEl.style.display = "flex";

  renderHistory();

  inputEl.focus();

}


/* =====================================================
   CLEAR CHAT
===================================================== */

function clearChat(){

  if(!conversation.length){

    return;

  }

  const ok =
    confirm("Hapus seluruh chat ALFA AI?");

  if(!ok) return;

  newChat();

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyEl.innerHTML = "";

  const userMessages =
    conversation
      .filter(item => item.role === "user");

  userMessages
    .slice()
    .reverse()
    .slice(0,15)
    .forEach(item => {

      const div =
        document.createElement("div");

      div.className = "history-item";

      div.textContent =
        item.content;

      div.onclick = () => {

        inputEl.value =
          item.content;

        inputEl.focus();

      };

      historyEl.appendChild(div);

    });

}


/* =====================================================
   ADD MESSAGE UI
===================================================== */

function addMessageToUI(
  role,
  text,
  scroll = true
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " +
    (role === "user" ? "user" : "ai");

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
    role === "user" ? "YOU" : "AI";

  const content =
    document.createElement("div");

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent =
    text;

  content.appendChild(bubble);

  if(role !== "user"){

    const tools =
      document.createElement("div");

    tools.className = "ai-tools";

    const speak =
      document.createElement("button");

    speak.className = "speak-btn";

    speak.textContent = "🔊 Dengarkan";

    speak.onclick = () => {

      speakText(text);

    };

    tools.appendChild(speak);

    content.appendChild(tools);

  }

  wrapper.appendChild(avatar);
  wrapper.appendChild(content);

  messagesEl.appendChild(wrapper);

  if(scroll){

    setTimeout(() => {

      wrapper.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },50);

  }

}


/* =====================================================
   TYPING
===================================================== */

function showTyping(){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message ai";

  wrapper.id =
    "typingMessage";

  const avatar =
    document.createElement("div");

  avatar.className = "avatar";
  avatar.textContent = "AI";

  const content =
    document.createElement("div");

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  content.appendChild(bubble);

  wrapper.appendChild(avatar);
  wrapper.appendChild(content);

  messagesEl.appendChild(wrapper);

  wrapper.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}


function removeTyping(){

  const typing =
    document.getElementById("typingMessage");

  if(typing){

    typing.remove();

  }

}


/* =====================================================
   EXTRACT AI RESPONSE
   FIX UTAMA: data.reply
===================================================== */

function extractAIAnswer(data){

  if(!data){

    return "";

  }

  /* STRING */

  if(typeof data === "string"){

    return data.trim();

  }

  /* PRIORITAS WORKER ALFA */

  if(typeof data.reply === "string"){

    return data.reply.trim();

  }

  /* FORMAT LAIN */

  if(typeof data.response === "string"){

    return data.response.trim();

  }

  if(typeof data.message === "string"){

    return data.message.trim();

  }

  if(typeof data.answer === "string"){

    return data.answer.trim();

  }

  if(typeof data.text === "string"){

    return data.text.trim();

  }

  if(typeof data.output_text === "string"){

    return data.output_text.trim();

  }

  if(typeof data.content === "string"){

    return data.content.trim();

  }

  /* RESULT */

  if(data.result){

    if(typeof data.result === "string"){

      return data.result.trim();

    }

    if(typeof data.result.reply === "string"){

      return data.result.reply.trim();

    }

    if(typeof data.result.response === "string"){

      return data.result.response.trim();

    }

    if(typeof data.result.text === "string"){

      return data.result.text.trim();

    }

    if(typeof data.result.message === "string"){

      return data.result.message.trim();

    }

  }

  /* OPENAI STYLE */

  if(
    Array.isArray(data.choices) &&
    data.choices.length > 0
  ){

    const choice =
      data.choices[0];

    if(
      choice.message &&
      typeof choice.message.content === "string"
    ){

      return choice.message.content.trim();

    }

    if(typeof choice.text === "string"){

      return choice.text.trim();

    }

  }

  return "";

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const text =
    inputEl.value.trim();

  if(!text){

    return;

  }

  inputEl.value = "";
  autoResize(inputEl);

  welcomeEl.style.display = "none";
  quickEl.style.display = "none";

  conversation.push({
    role:"user",
    content:text
  });

  addMessageToUI(
    "user",
    text
  );

  saveMemory();
  renderHistory();

  showTyping();

  try{

    const response =
      await fetch(API_URL,{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          message:text

        })

      });

    const raw =
      await response.text();

    console.log(
      "ALFA AI RAW RESPONSE:",
      raw
    );

    removeTyping();

    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status +
        ": " +
        raw
      );

    }

    let data;

    try{

      data =
        JSON.parse(raw);

    }catch{

      data =
        raw;

    }

    const answer =
      extractAIAnswer(data);

    if(!answer){

      const fallback =
        "ALFA AI menerima response dari Worker, tetapi format jawabannya belum dikenali.\n\nRaw response: " +
        raw;

      addMessageToUI(
        "assistant",
        fallback
      );

      conversation.push({
        role:"assistant",
        content:fallback
      });

      saveMemory();

      return;

    }

    /* ==========================================
       JAWABAN AI BERHASIL
    ========================================== */

    addMessageToUI(
      "assistant",
      answer
    );

    conversation.push({
      role:"assistant",
      content:answer
    });

    saveMemory();

    renderHistory();

    /* Jika pesan berasal dari voice,
       AI otomatis membacakan jawaban */

    if(window.__voiceRequest === true){

      speakText(answer);

      window.__voiceRequest = false;

    }

  }catch(error){

    console.error(
      "ALFA AI ERROR:",
      error
    );

    removeTyping();

    const errorText =
      "⚠️ ALFA AI mengalami error.\n\n" +
      error.message;

    addMessageToUI(
      "assistant",
      errorText
    );

    conversation.push({
      role:"assistant",
      content:errorText
    });

    saveMemory();

    window.__voiceRequest = false;

  }

}


/* =====================================================
   QUICK COMMAND
===================================================== */

function quickSend(text){

  inputEl.value =
    text;

  sendMessage();

}


/* =====================================================
   ENTER
===================================================== */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =====================================================
   AUTO RESIZE
===================================================== */

function autoResize(el){

  el.style.height =
    "auto";

  el.style.height =
    Math.min(
      el.scrollHeight,
      130
    ) + "px";

}


/* =====================================================
   VOICE SUPPORT CHECK
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* =====================================================
   INIT VOICE
===================================================== */

function setupRecognition(){

  if(!SpeechRecognition){

    voiceStatus.textContent =
      "⚠️ Browser ini belum mendukung Voice Chat.";

    micBtn.disabled = true;

    return;

  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "id-ID";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.maxAlternatives =
    1;


  recognition.onstart = () => {

    isRecording = true;

    micBtn.classList.add(
      "recording"
    );

    micBtn.textContent =
      "⏹️";

    voiceStatus.textContent =
      "🎙️ Mendengarkan... Silakan bicara.";

  };


  recognition.onresult =
    (event) => {

      let transcript = "";

      for(
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ){

        transcript +=
          event.results[i][0].transcript;

      }

      inputEl.value =
        transcript;

      autoResize(inputEl);

      voiceStatus.textContent =
        "🎙️ " + transcript;

    };


  recognition.onerror =
    (event) => {

      console.error(
        "Voice error:",
        event.error
      );

      voiceStatus.textContent =
        "⚠️ Voice error: " +
        event.error;

    };


  recognition.onend = () => {

    isRecording = false;

    micBtn.classList.remove(
      "recording"
    );

    micBtn.textContent =
      "🎙️";

    if(inputEl.value.trim()){

      voiceStatus.textContent =
        "🤖 Mengirim suara ke ALFA AI...";

      window.__voiceRequest = true;

      sendMessage();

    }else{

      voiceStatus.textContent =
        "";

    }

  };

}


/* =====================================================
   TOGGLE VOICE
===================================================== */

function toggleVoice(){

  if(!recognition){

    setupRecognition();

  }

  if(!recognition){

    return;

  }

  if(isRecording){

    recognition.stop();

    return;

  }

  inputEl.value = "";

  voiceStatus.textContent =
    "🎙️ Menyiapkan microphone...";

  try{

    recognition.start();

  }catch(error){

    console.error(error);

  }

}


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function speakText(text){

  if(!("speechSynthesis" in window)){

    voiceStatus.textContent =
      "⚠️ Browser tidak mendukung Text-to-Speech.";

    return;

  }

  speechSynthesis.cancel();

  currentUtterance =
    new SpeechSynthesisUtterance(text);

  currentUtterance.lang =
    "id-ID";

  currentUtterance.rate =
    0.95;

  currentUtterance.pitch =
    1;

  currentUtterance.volume =
    1;

  currentUtterance.onstart =
    () => {

      voiceStatus.textContent =
        "🔊 ALFA AI sedang berbicara...";

    };

  currentUtterance.onend =
    () => {

      voiceStatus.textContent =
        "";

    };

  currentUtterance.onerror =
    () => {

      voiceStatus.textContent =
        "⚠️ Voice playback gagal.";

    };

  speechSynthesis.speak(
    currentUtterance
  );

}


/* =====================================================
   MOBILE SIDEBAR
===================================================== */

function toggleSidebar(){

  document
    .getElementById("sidebar")
    .classList.toggle("open");

}


/* =====================================================
   START
===================================================== */

setupRecognition();

loadMemory();

inputEl.focus();

</script>
